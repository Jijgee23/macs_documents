\u041F\u0440\u043E\u0433\u0440\u0430\u043C\u043C \u0441\u0443\u0443\u043B\u0433\u0430\u0445\u0430\u0434 \u0434\u0430\u043D\u0441\u043D\u044B \u043A\u043E\u0434, \u043D\u044D\u0440 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u04AF\u04AF\u0441\u0441\u044D\u043D \u0431\u0430\u0439\u0434\u0430\u0433. \u0411\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u0430\u0434\u0430\u0430 \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0430\u043D \u043A\u043E\u0434\u044B\u0433 **\u0433\u04AF\u0439\u043B\u0433\u044D\u044D \u0445\u0438\u0439\u0436 \u044D\u0445\u043B\u044D\u0445\u044D\u044D\u0441 \u04E9\u043C\u043D\u04E9** \u0437\u0430\u0441\u043D\u0430.

### \u0410\u043B\u0445\u0430\u043C 5. \u042D\u0445\u043B\u044D\u043B\u0442\u0438\u0439\u043D \u0411\u0430\u043B\u0430\u043D\u0441

*\u0415\u0440\u04E9\u043D\u0445\u0438\u0439 \u2192 \u0414\u0430\u043D\u0441\u043D\u044B \u0442\u04E9\u043B\u04E9\u0432\u043B\u04E9\u0433\u04E9\u04E9*-\u043D\u0434 \u0431\u0430\u043B\u0430\u043D\u0441\u044B\u043D \u0434\u0430\u043D\u0441 \u0431\u04AF\u0440 \u0434\u044D\u044D\u0440 \u0434\u0430\u0432\u0445\u0430\u0440 \u0442\u043E\u0432\u0448\u0438\u0436 *\u042D\u0445\u043B\u044D\u043B\u0442\u0438\u0439\u043D \u0431\u0430\u043B\u0430\u043D\u0441* \u0445\u044D\u0441\u044D\u0433\u0442 \u044D\u0445\u043D\u0438\u0439 \u04AF\u043B\u0434\u044D\u0433\u0434\u043B\u0438\u0439\u0433 \u043C\u04E9\u043D\u0433\u04E9\u043D \u0434\u04AF\u043D\u0433\u044D\u044D\u0440 (\u0432\u0430\u043B\u044E\u0442\u044B\u043D \u0434\u0430\u043D\u0441 \u0431\u043E\u043B \u0432\u0430\u043B\u044E\u0442\u0430\u0430\u0440 \u043D\u044C) \u043E\u0440\u0443\u0443\u043B\u043D\u0430.

> \u0411\u0430\u043B\u0430\u043D\u0441\u044B\u043D **\u0434\u0435\u0431\u0435\u0442, \u043A\u0440\u0435\u0434\u0438\u0442 \u0434\u04AF\u043D \u0442\u044D\u043D\u0446\u044D\u0436** \u0431\u0430\u0439\u0432\u0430\u043B \u044D\u0445\u043B\u044D\u043B\u0442\u0438\u0439\u043D \u0431\u0430\u043B\u0430\u043D\u0441\u0430\u0430 \u0437\u04E9\u0432 \u043E\u0440\u0443\u0443\u043B\u0441\u0430\u043D \u0433\u044D\u0436 \u04AF\u0437\u043D\u044D.

### \u0410\u043B\u0445\u0430\u043C 6. \u0411\u0430\u043B\u0430\u043D\u0441\u044B\u043D \u0417\u0430\u0434\u0430\u0440\u0433\u0430\u0430

\u0411\u0430\u043B\u0430\u043D\u0441\u044B\u043D \u043D\u0438\u0439\u0442 \u0434\u04AF\u043D\u0433 3 \u0447\u0438\u0433\u043B\u044D\u043B\u044D\u044D\u0440 \u0437\u0430\u0434\u0430\u043B\u0436 \u043E\u0440\u0443\u0443\u043B\u043D\u0430:

- **\u0411\u0430\u0440\u0430\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B** \u2014 *\u0411\u0430\u0440\u0430\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u2192 \u0411\u0430\u0440\u0430\u0430\u043D\u044B \u0436\u0430\u0433\u0441\u0430\u0430\u043B\u0442 \u2192 \u0411\u0430\u0440\u0430\u0430 \u2192 \u0428\u0438\u043D\u044D* \u0433\u044D\u0436 \u043D\u044D\u0440 \u0442\u04E9\u0440\u04E9\u043B \u04AF\u04AF\u0441\u0433\u044D\u043D \u044D\u0445\u043D\u0438\u0439 \u04AF\u043B\u0434\u044D\u0433\u0434\u043B\u0438\u0439\u043D \u0442\u043E\u043E \u0445\u044D\u043C\u0436\u044D\u044D, \u043D\u044D\u0433\u0436 \u04E9\u0440\u0442\u0433\u0438\u0439\u0433 \u043E\u0440\u0443\u0443\u043B\u043D\u0430
- **\u0410\u0432\u043B\u0430\u0433\u0430 \u04E9\u0433\u043B\u04E9\u0433** \u2014 *\u0410\u0432\u043B\u0430\u0433\u0430 \u04E9\u0433\u043B\u04E9\u0433 \u2192 \u042D\u0445\u043D\u0438\u0439 \u04AF\u043B\u0434\u044D\u0433\u0434\u044D\u043B*-\u0434 \u0445\u0430\u0440\u0438\u043B\u0446\u0430\u0433\u0447 \u0431\u04AF\u0440\u044D\u044D\u0440 \u0437\u0430\u0434\u0430\u043B\u043D\u0430
- **\u04AE\u043D\u0434\u0441\u044D\u043D \u0445\u04E9\u0440\u04E9\u043D\u0433\u04E9** \u2014 *\u04AE\u043D\u0434\u0441\u044D\u043D \u0445\u04E9\u0440\u04E9\u043D\u0433\u04E9 \u2192 \u0425\u04E9\u0440\u04E9\u043D\u0433\u0438\u0439\u043D \u0436\u0430\u0433\u0441\u0430\u0430\u043B\u0442 \u2192 \u0428\u0438\u043D\u044D* \u0433\u044D\u0436 \u0445\u04E9\u0440\u04E9\u043D\u0433\u04E9 \u0431\u04AF\u0440\u0438\u0439\u0433 \u04E9\u0440\u0442\u04E9\u0433, \u0445\u0443\u0440\u0438\u043C\u0442\u043B\u0430\u0433\u0434\u0441\u0430\u043D \u044D\u043B\u044D\u0433\u0434\u044D\u043B\u0442\u044D\u0439 \u043D\u044C \u0431\u04AF\u0440\u0442\u0433\u044D\u043D\u044D

### \u0410\u043B\u0445\u0430\u043C 7. \u0417\u0430\u0434\u0430\u0440\u0433\u0430\u0430\u0433\u0430\u0430 \u0428\u0430\u043B\u0433\u0430\u0445

## MACS POS \u2014 \u041A\u0430\u0441\u0441\u044B\u043D \u0421\u0438\u0441\u0442\u0435\u043C

MACS POS \u043D\u044C \u043D\u044D\u0433 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C \u0434\u044D\u044D\u0440 **\u0433\u0443\u0440\u0432\u0430\u043D \u0433\u043E\u0440\u0438\u043C**\u043E\u043E\u0440 \u0430\u0436\u0438\u043B\u043B\u0430\u043D\u0430:

|\u0413\u043E\u0440\u0438\u043C|\u0425\u044D\u043D\u0434 \u0437\u043E\u0440\u0438\u0443\u043B\u0430\u0433\u0434\u0441\u0430\u043D|\u041E\u043D\u0446\u043B\u043E\u0433|
|---|---|---|
|**\u0416\u0438\u0436\u0438\u0433\u043B\u044D\u043D\u0433\u0438\u0439\u043D POS** (MacsPos)|\u0414\u044D\u043B\u0433\u04AF\u04AF\u0440, \u044D\u043C\u0438\u0439\u043D \u0441\u0430\u043D, \u0445\u0443\u0434\u0430\u043B\u0434\u0430\u0430\u043D\u044B \u0442\u04E9\u0432|\u0411\u0430\u0440\u043A\u043E\u0434 \u0441\u043A\u0430\u043D, \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442\u0438\u0439\u043D \u043A\u0430\u0440\u0442, \u0418-\u0411\u0430\u0440\u0438\u043C\u0442, \u042D\u041C\u0414|
|**Duty Free POS** (MacsPosDuty)|\u0422\u0430\u0442\u0432\u0430\u0440\u0433\u04AF\u0439 \u0431\u0430\u0440\u0430\u0430\u043D\u044B \u0434\u044D\u043B\u0433\u04AF\u04AF\u0440|\u041E\u043B\u043E\u043D \u0432\u0430\u043B\u044E\u0442\u0430\u0430\u0440 \u0442\u04E9\u043B\u0431\u04E9\u0440 \u0430\u0432\u0430\u0445, \u0445\u0430\u043D\u0448\u0438\u0439\u043D \u0442\u043E\u043E\u0446\u043E\u043E|
|**\u0420\u0435\u0441\u0442\u043E\u0440\u0430\u043D\u044B POS** (MacsRSPos)|\u0420\u0435\u0441\u0442\u043E\u0440\u0430\u043D, \u043A\u0430\u0444\u0435, \u043A\u0430\u0440\u0430\u043E\u043A\u0435, \u04AF\u0439\u043B\u0447\u0438\u043B\u0433\u044D\u044D|\u0422\u0430\u043D\u0445\u0438\u043C/\u0448\u0438\u0440\u044D\u044D, \u0433\u0430\u043B \u0442\u043E\u0433\u043E\u043E\u043D\u044B \u0431\u0438\u043B\u043B, \u0446\u0430\u0433 \u0437\u0430\u0445\u0438\u0430\u043B\u0433\u0430, \u0442\u043E\u043E\u0446\u043E\u043E \u0445\u0443\u0432\u0430\u0430\u0445|

\u0413\u0443\u0440\u0432\u0443\u0443\u043B\u0430\u0430 **\u043D\u044D\u0433 \u043C\u044D\u0434\u044D\u044D\u043B\u043B\u0438\u0439\u043D \u0441\u0430\u043D\u0442\u0430\u0439** \u0430\u0436\u0438\u043B\u043B\u0430\u0445 \u0442\u0443\u043B \u043A\u0430\u0441\u0441\u044B\u043D \u0431\u043E\u0440\u043B\u0443\u0443\u043B\u0430\u043B\u0442 \u043D\u044F\u0433\u0442\u043B\u0430\u043D\u0433\u0438\u0439\u043D \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u0434 \u0448\u0443\u0443\u0434 \u0431\u04AF\u0440\u0442\u0433\u044D\u0433\u0434\u044D\u043D\u044D. POS \u0433\u043E\u0440\u0438\u043C\u0434 \u0437\u04E9\u0432\u0445\u04E9\u043D "POS \u0411\u041E\u0420\u041B\u0423\u0423\u041B\u0410\u041B\u0422" \u0446\u044D\u0441 \u043D\u044D\u044D\u0433\u0434\u0434\u044D\u0433; \u043D\u044F\u0433\u0442\u043B\u0430\u043D\u0433\u0438\u0439\u043D \u0431\u04AF\u0440\u044D\u043D \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u0430\u0430\u0441 \u043C\u04E9\u043D *\u0411\u0430\u0440\u0430\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u2192 POS \u0431\u043E\u0440\u043B\u0443\u0443\u043B\u0430\u043B\u0442* \u0446\u044D\u0441\u044D\u044D\u0440 \u043A\u0430\u0441\u0441\u044B\u043D \u0446\u043E\u043D\u0445\u044B\u0433 \u043D\u044D\u044D\u0436 \u0431\u043E\u043B\u043D\u043E.

### \u041D\u044D\u0432\u0442\u0440\u044D\u0445, \u0433\u0430\u0440\u0430\u0445

\u0428\u0438\u0440\u044D\u044D\u043D\u0438\u0439 \u043A\u043E\u043C\u043F\u044C\u044E\u0442\u0435\u0440 \u0434\u044D\u044D\u0440\u0445 POS \u0445\u043E\u043B\u0431\u043E\u043E\u0441 \u0434\u044D\u044D\u0440 2 \u0434\u0430\u0440\u043D\u0430. \u041D\u044D\u0432\u0442\u0440\u044D\u0445 \u0446\u043E\u043D\u0445\u043E\u043D\u0434 **\u043D\u0443\u0443\u0446 \u04AF\u0433\u044D\u044D** \u043E\u0440\u0443\u0443\u043B\u0436 \u0445\u043E\u043B\u0431\u043E\u0433\u0434\u043E\u043D\u043E (\u043C\u044D\u0434\u044D\u044D\u043B\u043B\u0438\u0439\u043D \u0441\u0430\u043D, \u0445\u044D\u0440\u044D\u0433\u043B\u044D\u0433\u0447 \u0441\u043E\u043D\u0433\u043E\u0433\u0434\u0441\u043E\u043D \u0431\u0430\u0439\u0434\u0430\u0433). \u041D\u044D\u0432\u0442\u044D\u0440\u0441\u043D\u0438\u0439 \u0434\u0430\u0440\u0430\u0430 \u0431\u043E\u0440\u043B\u0443\u0443\u043B\u0430\u043B\u0442\u044B\u043D \u04AF\u043D\u0434\u0441\u044D\u043D \u0434\u044D\u043B\u0433\u044D\u0446 \u043D\u044D\u044D\u0433\u0434\u044D\u043D\u044D.

**\u042D\u044D\u043B\u0436 \u0441\u043E\u043B\u0438\u0445 / \u0413\u0430\u0440\u0430\u0445:** **F1 (\u041A\u043E\u043C\u043C\u0430\u043D\u0434) \u2192 Logout (F1)**. \u0414\u0430\u0440\u0430\u0430\u0433\u0438\u0439\u043D \u043A\u0430\u0441\u0441\u0447\u0438\u043D \u04E9\u04E9\u0440\u0438\u0439\u043D \u043D\u0443\u0443\u0446 \u04AF\u0433\u044D\u044D\u0440 \u043D\u044D\u0432\u0442\u044D\u0440\u043D\u044D. \u0422\u04AF\u0440 \u043E\u0440\u0445\u0438\u043E\u0434 \u04AF\u0440\u0433\u044D\u043B\u0436\u043B\u04AF\u04AF\u043B\u044D\u0445 \u0431\u043E\u043B **\u04AE\u0440\u0433\u044D\u043B\u0436\u043B\u04AF\u04AF\u043B\u044D\u0445 (F2)**.

**\u041D\u0443\u0443\u0446 \u04AF\u0433 \u0441\u043E\u043B\u0438\u0445:** F1 \u041A\u043E\u043C\u043C\u0430\u043D\u0434 \u0446\u044D\u0441\u043D\u0438\u0439 **\u041D\u0443\u0443\u0446 \u04AF\u0433 \u0441\u043E\u043B\u0438\u0445** \u0442\u043E\u0432\u0447\u043E\u043E\u0440.

> \u041A\u0430\u0441\u0441\u0447\u0438\u043D \u0431\u04AF\u0440 **\u04E9\u04E9\u0440\u0438\u0439\u043D \u043D\u044D\u0432\u0442\u0440\u044D\u0445 \u044D\u0440\u0445\u044D\u044D\u0440** \u0430\u0436\u0438\u043B\u043B\u0430\u043D\u0430 \u2014 \u0431\u043E\u0440\u043B\u0443\u0443\u043B\u0430\u043B\u0442, \u0431\u0443\u0446\u0430\u0430\u043B\u0442, \u0445\u0430\u0430\u043B\u0442 \u0431\u04AF\u0440 \u0445\u044D\u043D \u0445\u0438\u0439\u0441\u043D\u044D\u044D\u0440 \u0431\u04AF\u0440\u0442\u0433\u044D\u0433\u0434\u0434\u044D\u0433 \u0442\u0443\u043B \u043D\u0443\u0443\u0446 \u04AF\u0433\u044D\u044D \u0431\u0443\u0441\u0434\u0430\u0434 \u0434\u0430\u043C\u0436\u0443\u0443\u043B\u0436 \u0431\u043E\u043B\u043E\u0445\u0433\u04AF\u0439.

### \u0414\u044D\u043B\u0433\u04AF\u04AF\u0440 \u041D\u044D\u044D\u0445

\u0411\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u0430 "\u0414\u042D\u041B\u0413\u04AE\u04AE\u0420 \u041D\u042D\u042D\u0425" \u043A\u043E\u043C\u0430\u043D\u0434\u044B\u0433 \u0430\u0448\u0438\u0433\u043B\u0430\u0434\u0430\u0433 \u0431\u043E\u043B (\u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u0433\u043E\u043E\u0440 \u0438\u0434\u044D\u0432\u0445\u0436\u0434\u044D\u0433) \u04E9\u0434\u0440\u0438\u0439\u043D \u044D\u0445\u044D\u043D\u0434 **F1 \u041A\u043E\u043C\u043C\u0430\u043D\u0434 \u2192 \u0414\u044D\u043B\u0433\u04AF\u04AF\u0440 \u043D\u044D\u044D\u0445** \u04AF\u0439\u043B\u0434\u043B\u0438\u0439\u0433 \u0437\u0430\u0430\u0432\u0430\u043B \u0445\u0438\u0439\u043D\u044D.

## \u0411\u0430\u0440\u0430\u0430 \u041D\u044D\u043C\u044D\u0445

**\u0411\u0430\u0440\u043A\u043E\u0434\u043E\u043E\u0440:** \u0441\u043A\u0430\u043D\u043D\u0435\u0440\u0430\u0430\u0440 \u0443\u043D\u0448\u0443\u0443\u043B\u0430\u0445\u0430\u0434 \u0431\u0430\u0440\u0430\u0430 \u0448\u0443\u0443\u0434 \u043C\u04E9\u0440 \u0431\u043E\u043B\u0436 \u043D\u044D\u043C\u044D\u0433\u0434\u044D\u043D\u044D. \u0413\u0430\u0440\u0430\u0430\u0440 \u043E\u0440\u0443\u0443\u043B\u0430\u0445 \u0431\u043E\u043B **F11** \u0434\u0430\u0440\u0436 \u043A\u043E\u0434\u044B\u043D \u0442\u0430\u043B\u0431\u0430\u0440\u0442 \u0431\u0438\u0447\u044D\u044D\u0434 Enter \u0434\u0430\u0440\u043D\u0430.

**\u0416\u0438\u043D\u0442\u044D\u0439 (\u0433\u0440\u0430\u043C\u043C\u044B\u043D) \u0431\u0430\u0440\u043A\u043E\u0434** \u2014 \u0436\u0438\u043D\u0433\u0438\u0439\u043D \u043C\u0430\u0448\u0438\u043D\u0430\u0430\u0441 \u0445\u044D\u0432\u043B\u044D\u0433\u0434\u0441\u044D\u043D \u0448\u043E\u0448\u0433\u044B\u0433 \u0443\u043D\u0448\u0443\u0443\u043B\u0430\u0445\u0430\u0434 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u043D\u0434 \u0437\u0430\u0430\u0441\u0430\u043D \u0431\u04AF\u0442\u0446\u044D\u044D\u0440 (\u043F\u0440\u0435\u0444\u0438\u043A\u0441 + \u0431\u0430\u0440\u0430\u0430\u043D\u044B \u043A\u043E\u0434 + \u0436\u0438\u043D) \u0437\u0430\u0434\u0430\u043B\u0436, \u0436\u0438\u043D\u0433 \u0442\u043E\u043E \u0445\u044D\u043C\u0436\u044D\u044D \u0431\u043E\u043B\u0433\u043E\u043D \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0431\u043E\u0434\u043D\u043E.

**\u0421\u0435\u0440\u0438\u0430\u0440** \u2014 \u0431\u0430\u0440\u043A\u043E\u0434 \u043D\u044C \u0441\u0435\u0440\u0438\u0439\u043D \u0434\u0443\u0433\u0430\u0430\u0440\u0442\u0430\u0439 \u0442\u0430\u0430\u0440\u0432\u0430\u043B \u0442\u0443\u0445\u0430\u0439\u043D \u0441\u0435\u0440\u0438\u0439\u043D \u0431\u0430\u0440\u0430\u0430 \u0441\u043E\u043D\u0433\u043E\u0433\u0434\u043E\u043D\u043E; \u0441\u0435\u0440\u0438\u0439\u0433 \u0441\u043E\u043B\u0438\u0445 \u0431\u043E\u043B **F4 (\u0421\u0435\u0440\u0438 \u04E9\u04E9\u0440\u0447\u043B\u04E9\u0445)**.

**\u0425\u0430\u0439\u043B\u0442\u0430\u0430\u0440:** **Ctrl+F** \u0434\u0430\u0440\u0436 (\u044D\u0441\u0432\u044D\u043B \u0431\u0430\u0440\u0430\u0430\u043D\u044B \u0436\u0430\u0433\u0441\u0430\u0430\u043B\u0442\u044B\u043D \u0442\u0430\u0431) \u043D\u044D\u0440\u044D\u044D\u0440 \u0448\u04AF\u04AF\u0436 \u0441\u043E\u043D\u0433\u043E\u043D\u043E.

**\u0411\u0430\u0440\u0430\u0430\u043D\u044B \u043C\u044D\u0434\u044D\u044D\u043B\u044D\u043B \u0445\u0430\u0440\u0430\u0445:** **Ctrl+P** \u2014 \u0441\u043E\u043D\u0433\u043E\u0441\u043E\u043D \u0431\u0430\u0440\u0430\u0430\u043D\u044B \u0437\u0430\u0440\u0430\u0445 \u04AF\u043D\u044D, \u0431\u04E9\u04E9\u043D\u0438\u0439 \u04AF\u043D\u044D/\u0442\u043E\u043E, \u0441\u0435\u0440\u0438, \u0434\u0443\u0443\u0441\u0430\u0445 \u0445\u0443\u0433\u0430\u0446\u0430\u0430, \u04AF\u043B\u0434\u044D\u0433\u0434\u044D\u043B \u0445\u0430\u0440\u0430\u0433\u0434\u0430\u043D\u0430.

## \u0422\u043E\u043E \u0425\u044D\u043C\u0436\u044D\u044D \u0417\u0430\u0441\u0430\u0445, \u041C\u04E9\u0440 \u0423\u0441\u0442\u0433\u0430\u0445

**\u0422\u043E\u043E** \u0431\u0430\u0433\u0430\u043D\u0430\u0434 \u043E\u0447\u0438\u0436 **F5** (\u044D\u0441\u0432\u044D\u043B \u0448\u0443\u0443\u0434) \u0434\u0430\u0440\u0436 \u0442\u043E\u043E\u0433 \u0437\u0430\u0441\u043D\u0430 \u2014 \u0437\u0430\u0441\u0432\u0430\u0440\u043B\u0430\u0445 \u0446\u043E\u043D\u0445 "\u0422\u043E\u043E \u0437\u0430\u0441\u0430\u0445" \u043D\u044D\u044D\u0433\u0434\u044D\u043D\u044D.

\u041C\u04E9\u0440 \u0443\u0441\u0442\u0433\u0430\u0445 \u2014 **Delete**; \u0442\u043E\u043E\u0433 **0** \u0431\u043E\u043B\u0433\u043E\u0445\u043E\u0434 \u043C\u04E9\u0440 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0443\u0441\u0442\u0434\u0430\u0433 \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u0442\u043E\u0439 \u0431\u0430\u0439\u0436 \u0431\u043E\u043B\u043D\u043E.

> \u04AE\u043D\u044D, \u0442\u043E\u043E, \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442\u0438\u0439\u0433 \u0433\u0430\u0440\u0430\u0430\u0441 \u0437\u0430\u0441\u0430\u0445 \u044D\u0440\u0445 \u043D\u044C POS-\u044B\u043D \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u0433\u043E\u043E\u0440 \u043D\u044D\u044D\u0433\u0434\u0434\u044D\u0433 \u2014 \u044D\u0440\u0445\u0433\u04AF\u0439 \u0431\u043E\u043B \u0430\u0445\u043B\u0430\u0445\u0434\u0430\u0430 \u0445\u0430\u043D\u0434\u0430\u043D\u0430.

## \u0417\u044D\u0440\u044D\u0433\u0446\u044D\u044D \u0411\u0438\u043B\u043B (\u0411\u0438\u043B\u043B \u0422\u04AF\u0440 \u0425\u043E\u0439\u0448\u043B\u0443\u0443\u043B\u0430\u0445)

\u041D\u044D\u0433 \u0445\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447\u0438\u0439\u043D \u0442\u043E\u043E\u0446\u043E\u043E \u0434\u0443\u0443\u0441\u0430\u0430\u0433\u04AF\u0439 \u0431\u0430\u0439\u0445\u0430\u0434 \u0434\u0430\u0440\u0430\u0430\u0433\u0438\u0439\u043D \u0445\u04AF\u043D\u0434 \u04AF\u0439\u043B\u0447\u043B\u044D\u0445 \u0431\u043E\u043B:

- **Ctrl+F12** \u2014 \u043D\u044D\u044D\u043B\u0442\u0442\u044D\u0439 \u0431\u0438\u043B\u043B\u04AF\u04AF\u0434\u0438\u0439\u043D \u0445\u043E\u043E\u0440\u043E\u043D\u0434 \u0448\u0438\u043B\u0436\u0438\u043D\u044D (\u0431\u0438\u043B\u043B\u04AF\u04AF\u0434 \u0445\u0430\u0432\u0442\u0430\u043D\u0446\u0430\u0440 \u0445\u044D\u043B\u0431\u044D\u0440\u044D\u044D\u0440 \u0445\u0430\u0440\u0430\u0433\u0434\u0430\u043D\u0430).

\u0425\u0430\u0430\u0433\u0434\u0430\u0430\u0433\u04AF\u0439 \u0431\u0438\u043B\u043B \u0434\u0430\u0440\u0430\u0430 \u043D\u044D\u044D\u0445\u044D\u0434 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C \u0441\u0430\u043D\u0443\u0443\u043B\u0436 \u0445\u0430\u0440\u0443\u0443\u043B\u043D\u0430; \u04E9\u0434\u0440\u0438\u0439\u043D \u0445\u0430\u0430\u043B\u0442\u044B\u043D \u04E9\u043C\u043D\u04E9 **\u0431\u04AF\u0445 \u0431\u0438\u043B\u043B\u0438\u0439\u0433 \u0445\u0430\u0430\u0445** \u0451\u0441\u0442\u043E\u0439.

## \u0425\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442\u0438\u0439\u043D \u041A\u0430\u0440\u0442 (F10)

**F10** \u0434\u0430\u0440\u0436 \u043A\u0430\u0440\u0442\u044B\u043D \u0434\u0443\u0433\u0430\u0430\u0440\u044B\u0433 \u0443\u043D\u0448\u0443\u0443\u043B\u043D\u0430 (\u0441\u043A\u0430\u043D\u043D\u0435\u0440) \u044D\u0441\u0432\u044D\u043B \u0434\u0443\u0433\u0430\u0430\u0440/\u0443\u0442\u0430\u0441\u043D\u044B \u0434\u0443\u0433\u0430\u0430\u0440\u0430\u0430\u0440 \u0445\u0430\u0439\u043D\u0430.

"\u041A\u0430\u0440\u0442 \u044D\u0437\u044D\u043C\u0448\u0438\u0433\u0447\u0438\u0439\u043D \u043C\u044D\u0434\u044D\u044D\u043B\u044D\u043B" \u0446\u043E\u043D\u0445\u043E\u043D\u0434 \u044D\u0437\u044D\u043C\u0448\u0438\u0433\u0447, \u0445\u0430\u043C\u0442\u0440\u0430\u043D \u044D\u0437\u044D\u043C\u0448\u0438\u0433\u0447, **\u0431\u043E\u043D\u0443\u0441\u044B\u043D \u04AF\u043B\u0434\u044D\u0433\u0434\u044D\u043B**, \u043A\u0430\u0440\u0442\u044B\u043D \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442\u0438\u0439\u043D \u0445\u0443\u0432\u044C, \u0437\u0430\u0440\u0446\u0443\u0443\u043B\u0436 \u0431\u043E\u043B\u043E\u0445 \u0434\u04AF\u043D \u0445\u0430\u0440\u0430\u0433\u0434\u0430\u043D\u0430.

\u0411\u0430\u0442\u0430\u043B\u0433\u0430\u0430\u0436\u0443\u0443\u043B\u0441\u043D\u0430\u0430\u0440 \u043A\u0430\u0440\u0442\u044B\u043D \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442 \u0431\u0438\u043B\u043B\u0438\u0439\u043D \u0431\u0430\u0440\u0430\u0430\u043D\u0443\u0443\u0434\u0430\u0434 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0431\u043E\u0434\u043E\u0433\u0434\u043E\u043D\u043E (*\u041A\u0430\u0440\u0442 \u0445\u04E9\u043D %* \u0431\u0430\u0433\u0430\u043D\u0430).

> \u0411\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u044B\u043D \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u043D\u043E\u043E\u0441 \u0445\u0430\u043C\u0430\u0430\u0440\u0447 \u043A\u0430\u0440\u0442\u044B\u043D \u0434\u0443\u0433\u0430\u0430\u0440/\u0443\u0442\u0441\u0430\u0430\u0440 \u0445\u0430\u0439\u0445\u0430\u0434 **\u043D\u0443\u0443\u0446 \u043A\u043E\u0434** \u0430\u0441\u0443\u0443\u0434\u0430\u0433; \u043A\u0430\u0440\u0442 \u0443\u043D\u0448\u0438\u0433\u0447 \u0442\u04E9\u0445\u04E9\u04E9\u0440\u04E9\u043C\u0436\u04E9\u04E9\u0440 \u0443\u043D\u0448\u0443\u0443\u043B\u0430\u0445\u0430\u0434 \u043A\u043E\u0434 \u0430\u0441\u0443\u0443\u0434\u0430\u0433\u0433\u04AF\u0439 \u0431\u0430\u0439\u0445\u0430\u0430\u0440 \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0436 \u0431\u043E\u043B\u043D\u043E.

\u041A\u0430\u0440\u0442\u044B\u043D \u0442\u04E9\u0440\u043B\u04AF\u04AF\u0434 (\u0442\u043E\u0433\u0442\u043C\u043E\u043B \u0445\u0443\u0432\u044C, \u0431\u043E\u043D\u0443\u0441 \u0445\u0443\u0440\u0438\u043C\u0442\u043B\u0443\u0443\u043B\u0430\u0445, \u0448\u0430\u0442\u043B\u0430\u043B\u0442\u0430\u0439, \u043C\u04E9\u043D\u0433\u04E9\u043D \u0434\u04AF\u043D\u0433\u044D\u044D\u0440) \u0431\u043E\u043B\u043E\u043D \u0442\u044D\u0434\u0433\u044D\u044D\u0440\u0438\u0439\u043D \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u0433 \u043D\u044F\u0433\u0442\u043B\u0430\u043D\u0433\u0438\u0439\u043D \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u044B\u043D *\u0411\u0430\u0440\u0430\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u2192 \u0425\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442 \u043A\u0430\u0440\u0442* \u0446\u044D\u0441\u043D\u044D\u044D\u0441 \u0443\u0434\u0438\u0440\u0434\u0430\u043D\u0430.

## \u0413\u0430\u0440 \u0425\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442 (Ctrl+D)

\u042D\u0440\u0445 \u0431\u04AF\u0445\u0438\u0439 \u0445\u044D\u0440\u044D\u0433\u043B\u044D\u0433\u0447 **\u0425\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442 (Ctrl+D)** \u0446\u043E\u043D\u0445\u043E\u043E\u0440 \u0434\u0430\u0440\u0430\u0430\u0445 \u0442\u04E9\u0440\u043B\u0438\u0439\u043D \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442\u0438\u0439\u0433 \u04E9\u0433\u043D\u04E9:

- **\u04AE\u043D\u0438\u0439\u043D \u0434\u04AF\u043D\u0433\u044D\u044D\u0441 \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u0445** \u2014 \u0431\u0438\u043B\u043B\u0438\u0439\u043D \u043D\u0438\u0439\u0442 \u0434\u04AF\u043D\u0433\u044D\u044D\u0441 \u0442\u043E\u0434\u043E\u0440\u0445\u043E\u0439 \u0434\u04AF\u043D/\u0445\u0443\u0432\u044C
- **\u0411\u04AF\u0445 \u0431\u0430\u0440\u0430\u0430\u043D\u0434 X% \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u0445**
- **\u0411\u04AF\u0445 \u0431\u0430\u0440\u0430\u0430\u043D\u0430\u0430\u0441 \u20AE-\u04E9\u04E9\u0440 \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u0445**
- **\u0411\u04AF\u0445 \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442\u0438\u0439\u0433 \u0443\u0441\u0442\u0433\u0430\u0445** \u2014 \u04E9\u0433\u0441\u04E9\u043D \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442\u04AF\u04AF\u0434\u0438\u0439\u0433 \u0446\u0443\u0446\u043B\u0430\u043D\u0430

\u041D\u044F\u0433\u0442\u043B\u0430\u043D\u0433\u0438\u0439\u043D \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u0434 \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0441\u0430\u043D \u0443\u0440\u0430\u043C\u0448\u0443\u0443\u043B\u043B\u0443\u0443\u0434 \u043A\u0430\u0441\u0441\u0430\u043D\u0434 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0430\u0436\u0438\u043B\u043B\u0430\u043D\u0430:

**\u0423\u0440\u0430\u043C\u0448\u0443\u0443\u043B\u043B\u044B\u043D \u0431\u0430\u0440\u0430\u0430** \u2014 \u04AF\u043D\u0434\u0441\u044D\u043D \u0431\u0430\u0440\u0430\u0430\u0433 \u0437\u0430\u0440\u0430\u0445\u0430\u0434 \u0443\u0440\u0430\u043C\u0448\u0443\u0443\u043B\u0430\u043B\u0434 \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0441\u0430\u043D \u0431\u0430\u0440\u0430\u0430\u043D\u0443\u0443\u0434\u0430\u0430\u0441 \u0441\u043E\u043D\u0433\u0443\u0443\u043B\u0430\u0445 \u0446\u043E\u043D\u0445 \u0433\u0430\u0440\u0447, \u0441\u043E\u043D\u0433\u043E\u0441\u043E\u043D \u0431\u0430\u0440\u0430\u0430 \u04AF\u043D\u044D\u0433\u04AF\u0439 (\u044D\u0441\u0432\u044D\u043B \u0437\u0430\u0430\u0441\u0430\u043D \u0445\u0443\u0432\u0438\u0430\u0440) \u043D\u044D\u043C\u044D\u0433\u0434\u044D\u043D\u044D.
`},"pos-pay-cash":{t:"\u0411\u044D\u043B\u043D\u044D\u044D\u0440",b:`

\u0422\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u043D \u0442\u04E9\u0440\u04E9\u043B\u0434 **\u0411\u044D\u043B\u043D\u044D\u044D\u0440**-\u0438\u0439\u0433 \u0441\u043E\u043D\u0433\u043E\u043D\u043E (\u0430\u043D\u0445\u0434\u0430\u0433\u0447).

## \u0411\u0430\u043D\u043A\u043D\u044B \u041A\u0430\u0440\u0442\u0430\u0430\u0440 \u0422\u04E9\u043B\u0431\u04E9\u0440 \u0410\u0432\u0430\u0445

\u0422\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u043D \u0442\u04E9\u0440\u04E9\u043B\u0434 \u0431\u0430\u043D\u043A\u0430\u0430 \u0441\u043E\u043D\u0433\u043E\u0445\u043E\u0434 POS \u0442\u0435\u0440\u043C\u0438\u043D\u0430\u043B \u0440\u0443\u0443 \u0434\u04AF\u043D **\u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0438\u043B\u0433\u044D\u044D\u0433\u0434\u044D\u043D\u044D** (\u0442\u0435\u0440\u043C\u0438\u043D\u0430\u043B\u044B\u043D \u0445\u043E\u043B\u0431\u043E\u043B\u0442 \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0441\u0430\u043D \u04AF\u0435\u0434): \u0425\u0430\u0430\u043D \u0431\u0430\u043D\u043A, \u0425\u0425\u0411 (TDB), \u0425\u0430\u0441/\u0410\u0440\u0438\u0433 (Verifone), \u0422\u04E9\u0440\u0438\u0439\u043D \u0431\u0430\u043D\u043A \u0437\u044D\u0440\u044D\u0433 \u0442\u0435\u0440\u043C\u0438\u043D\u0430\u043B\u0443\u0443\u0434\u0442\u0430\u0439 \u0448\u0443\u0443\u0434 \u0445\u043E\u043B\u0431\u043E\u0433\u0434\u043E\u043D\u043E. \u041A\u0430\u0440\u0442 \u0443\u043D\u0448\u0438\u0433\u0434\u0430\u0436 \u0433\u04AF\u0439\u043B\u0433\u044D\u044D \u0430\u043C\u0436\u0438\u043B\u0442\u0442\u0430\u0439 \u0431\u043E\u043B\u043C\u043E\u0433\u0446 \u0431\u0430\u0440\u0438\u043C\u0442 \u0445\u044D\u0432\u043B\u044D\u0433\u0434\u044D\u043D\u044D.

\u0422\u0435\u0440\u043C\u0438\u043D\u0430\u043B \u0445\u043E\u043B\u0431\u043E\u043E\u0433\u04AF\u0439 \u0431\u043E\u043B \u043A\u0430\u0440\u0442\u044B\u043D \u0433\u04AF\u0439\u043B\u0433\u044D\u044D\u0433 \u0442\u0435\u0440\u043C\u0438\u043D\u0430\u043B \u0434\u044D\u044D\u0440 \u0433\u0430\u0440\u0430\u0430\u0440 \u0445\u0438\u0439\u0436, POS-\u0434 \u0434\u04AF\u043D\u0433 \u043D\u044C \u0431\u04AF\u0440\u0442\u0433\u044D\u043D\u044D.

## \u0417\u044D\u044D\u043B\u044D\u044D\u0440 \u041E\u043B\u0433\u043E\u0445

**\u0417\u044D\u044D\u043B\u044D\u044D\u0440** \u2014 \u0433\u044D\u0440\u044D\u044D\u0442 \u0445\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447\u0438\u0434 \u0437\u044D\u044D\u043B\u044D\u044D\u0440 \u043E\u043B\u0433\u043E\u043D\u043E. \u0425\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447 \u043D\u044C **Macs-\u0438\u0439\u043D \u0445\u0430\u0440\u0438\u043B\u0446\u0430\u0433\u0447\u0430\u0430\u0440** \u0431\u04AF\u0440\u0442\u0433\u044D\u043B\u0442\u044D\u0439, \u0437\u044D\u044D\u043B\u0438\u0439\u043D \u0434\u0430\u043D\u0441\u0442\u0430\u0439 \u0445\u043E\u043B\u0431\u043E\u0433\u0434\u0441\u043E\u043D \u0431\u0430\u0439\u0445 \u0451\u0441\u0442\u043E\u0439 (\u0418-\u0411\u0430\u0440\u0438\u043C\u0442\u044B\u043D "\u0411\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u0430" \u0431\u04AF\u0440\u0442\u0433\u044D\u043B\u044D\u044D\u0440 \u0445\u043E\u043B\u0431\u043E\u043D\u043E). \u0411\u043E\u0440\u043B\u0443\u0443\u043B\u0430\u043B\u0442 \u043D\u044F\u0433\u0442\u043B\u0430\u043D\u0433\u0438\u0439\u043D \u0430\u0432\u043B\u0430\u0433\u0430\u0434 \u0448\u0443\u0443\u0434 \u0431\u04AF\u0440\u0442\u0433\u044D\u0433\u0434\u044D\u043D\u044D.

**\u0414\u0430\u0440\u0430\u0430 \u0442\u043E\u043E\u0446\u043E\u043E (RECPAY)** \u2014 \u0431\u0443\u0441\u0430\u0434 \u0442\u04E9\u043B\u0431\u04E9\u0440\u0442\u044D\u0439 **\u0445\u0430\u043C\u0442 \u0445\u044D\u0440\u044D\u0433\u043B\u044D\u0436 \u0431\u043E\u043B\u043E\u0445\u0433\u04AF\u0439**, \u0431\u0438\u043B\u043B\u0438\u0439\u0433 \u0431\u04AF\u0445\u044D\u043B\u0434 \u043D\u044C \u0434\u0430\u0440\u0430\u0430 \u0442\u043E\u043E\u0446\u043E\u043E\u0433\u043E\u043E\u0440 \u0431\u04AF\u0440\u0442\u0433\u044D\u043D\u044D.

\u0425\u0430\u0440\u0438\u043B\u0446\u0430\u0433\u0447\u0438\u0434 **\u0437\u044D\u044D\u043B\u0438\u0439\u043D \u0434\u044D\u044D\u0434 \u0445\u044F\u0437\u0433\u0430\u0430\u0440** \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0441\u0430\u043D \u0431\u043E\u043B \u0445\u044F\u0437\u0433\u0430\u0430\u0440 \u0445\u044D\u0442\u0440\u044D\u0445\u044D\u0434 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C \u0430\u043D\u0445\u0430\u0430\u0440\u0443\u0443\u043B\u043D\u0430/\u0445\u043E\u0440\u0438\u0433\u043B\u043E\u043D\u043E.
`},"pos-pay-voucher":{t:"\u0411\u044D\u043B\u0433\u0438\u0439\u043D \u041A\u0430\u0440\u0442 / \u0412\u0430\u0443\u0447\u0435\u0440",b:`

## \u0422\u04E9\u043B\u0431\u04E9\u0440 \u0425\u0443\u0432\u0430\u0430\u0445 \u0410\u0440\u0433\u0443\u0443\u0434

**\u0425\u043E\u043B\u0438\u043C\u043E\u0433 \u0442\u04E9\u043B\u0431\u04E9\u0440** \u2014 \u043D\u044D\u0433 \u0431\u0438\u043B\u043B\u0438\u0439\u0433 \u0445\u044D\u0434 \u0445\u044D\u0434\u044D\u043D \u0442\u04E9\u0440\u043B\u04E9\u04E9\u0440 (\u0436\u0438\u0448\u044D\u044D \u043D\u044C \u0445\u0430\u0433\u0430\u0441\u044B\u0433 \u0431\u044D\u043B\u043D\u044D\u044D\u0440, \u0445\u0430\u0433\u0430\u0441\u044B\u0433 \u043A\u0430\u0440\u0442\u0430\u0430\u0440) \u0442\u04E9\u043B\u0436 \u0431\u043E\u043B\u043D\u043E: \u0442\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u043D \u043C\u04E9\u0440 \u0431\u04AF\u0440\u0434 \u0442\u04E9\u0440\u04E9\u043B, \u0434\u04AF\u043D\u0433 \u043E\u0440\u0443\u0443\u043B\u043D\u0430.

**\u0425\u0443\u0432\u0430\u0430\u0445** \u2014 "\u0425\u0443\u0432\u0430\u0430\u0445 \u0445\u04AF\u043D\u0438\u0439 \u0442\u043E\u043E"-\u0433 \u043E\u0440\u0443\u0443\u043B\u0430\u0445\u0430\u0434 \u0431\u0438\u043B\u043B\u0438\u0439\u0433 \u0442\u044D\u043D\u0446\u04AF\u04AF \u0445\u0443\u0432\u0430\u0430\u0436 \u0442\u0443\u0441 \u0431\u04AF\u0440\u0434 \u043D\u044C \u0442\u043E\u043E\u0446\u043E\u043E \u04AF\u04AF\u0441\u0433\u044D\u043D\u044D.

**\u0411\u0430\u0440\u0430\u0430\u0433\u0430\u0430\u0440** \u2014 \u0431\u0438\u043B\u043B\u0438\u0439\u043D \u0431\u0430\u0440\u0430\u0430\u043D\u0443\u0443\u0434\u044B\u0433 \u044F\u043B\u0433\u0430\u0436 \u0445\u044D\u0441\u044D\u0433\u0447\u043B\u044D\u043D \u0442\u043E\u043E\u0446\u043E\u043E \u0445\u0438\u0439\u043D\u044D.

## \u0422\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u043D \u0428\u0430\u0442\u0430\u043D\u0434 \u0418-\u0411\u0430\u0440\u0438\u043C\u0442 \u0411\u04AF\u0440\u0442\u0433\u044D\u0445

\u0422\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u043D \u0448\u0430\u0442\u0430\u043D\u0434 \u0445\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447\u0438\u0439\u043D \u0418-\u0411\u0430\u0440\u0438\u043C\u0442\u044B\u043D \u0431\u04AF\u0440\u0442\u0433\u044D\u043B\u0438\u0439\u0433 "E-\u0411\u0430\u0440\u0438\u043C\u0442 \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E" \u0446\u043E\u043D\u0445\u043E\u043D\u0434 \u0445\u0438\u0439\u043D\u044D:

### \u0425\u0443\u0432\u044C \u0425\u04AF\u043D (F2)

\u0425\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447 **\u0418-\u0411\u0430\u0440\u0438\u043C\u0442\u0430\u0434 \u0431\u04AF\u0440\u0442\u0433\u044D\u043B\u0442\u044D\u0439 \u0443\u0442\u0430\u0441\u043D\u044B \u0434\u0443\u0433\u0430\u0430\u0440 (F2)** \u044D\u0441\u0432\u044D\u043B **\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0439\u043D \u0434\u0443\u0433\u0430\u0430\u0440\u0430\u0430** \u04E9\u0433\u0432\u04E9\u043B \u043E\u0440\u0443\u0443\u043B\u0430\u0430\u0434 **\u0428\u0430\u043B\u0433\u0430\u0445** (Enter/Ctrl+F) \u0434\u0430\u0440\u043D\u0430 \u2014 \u043D\u044D\u0440, \u0438-\u043C\u044D\u0439\u043B \u0442\u0430\u0442\u0430\u0433\u0434\u0430\u043D\u0430.

\u0411\u04AF\u0440\u0442\u0433\u044D\u043B\u0433\u04AF\u0439 \u0431\u043E\u043B \u044D\u043D\u0433\u0438\u0439\u043D \u0438\u0440\u0433\u044D\u043D\u0438\u0439 \u0431\u0430\u0440\u0438\u043C\u0442 \u0445\u044D\u0432\u043B\u044D\u0433\u0434\u044D\u0436, \u0441\u0443\u0433\u0430\u043B\u0430\u0430\u043D\u044B \u0434\u0443\u0433\u0430\u0430\u0440 \u043E\u043B\u0433\u043E\u0433\u0434\u043E\u043D\u043E.

> **\u0425\u044F\u043B\u0431\u0430\u0440 \u0431\u04AF\u0440\u0442\u0433\u044D\u043B** \u0433\u043E\u0440\u0438\u043C \u0438\u0434\u044D\u0432\u0445\u0442\u044D\u0439 \u0431\u043E\u043B \u0446\u0430\u0430\u0441\u0430\u043D \u0431\u0430\u0440\u0438\u043C\u0442 \u0445\u044D\u0432\u043B\u044D\u0445\u0433\u04AF\u0439\u0433\u044D\u044D\u0440 \u0431\u0430\u0440\u0438\u043C\u0442\u044B\u0433 \u0445\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447\u0438\u0439\u043D \u0418-\u0411\u0430\u0440\u0438\u043C\u0442 \u0440\u0443\u0443 \u0448\u0443\u0443\u0434 \u0431\u04AF\u0440\u0442\u0433\u044D\u043D\u044D ("\u0418\u0411\u0430\u0440\u0438\u043C\u0442\u0430\u0434 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0431\u04AF\u0440\u0442\u0433\u044D\u0445 \u044D\u0441\u044D\u0445" \u0447\u0435\u043A); \u0438-\u043C\u044D\u0439\u043B\u044D\u044D\u0440 \u0438\u043B\u0433\u044D\u044D\u0445 \u0441\u043E\u043D\u0433\u043E\u043B\u0442 \u0431\u0430\u0441 \u0431\u0438\u0439.

### \u0411\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u0430 (F3)

\u0422\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u043D \u0446\u043E\u043D\u0445\u043D\u044B **\u0411\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u0430 \u0431\u043E\u043B (F3)** \u0434\u0430\u0440\u043D\u0430.

\u0411\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u044B\u043D **\u0422\u0422\u0414/\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u044D\u044D\u0440** \u0445\u0430\u0439\u0436 (Ctrl+F) \u0441\u043E\u043D\u0433\u043E\u043D\u043E; \u041D\u04E8\u0410\u0422 \u0442\u04E9\u043B\u04E9\u0433\u0447 / \u041D\u0425\u0410\u0422 \u0442\u04E9\u043B\u04E9\u0433\u0447 \u0442\u04E9\u043B\u04E9\u0432 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0442\u043E\u0434\u043E\u0440\u0445\u043E\u0439\u043B\u043E\u0433\u0434\u043E\u043D\u043E.

\u0411\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u044B\u043D \u0445\u0443\u0432\u044C \u0431\u0430\u0440\u0438\u043C\u0442 \u0445\u044D\u0432\u043B\u044D\u0433\u0434\u044D\u043D\u044D; \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u0433\u043E\u043E\u0440 **\u0431\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u044B\u043D \u0445\u0443\u0432\u044C \u0434\u0430\u0432\u0445\u0430\u0440 \u0445\u044D\u0432\u043B\u044D\u0445** \u0431\u043E\u043B\u043E\u043C\u0436\u0442\u043E\u0439.

> \u0417\u044D\u044D\u043B\u044D\u044D\u0440 \u043E\u043B\u0433\u043E\u0445 \u0431\u043E\u043B \u0431\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u044B\u0433 Macs-\u0438\u0439\u043D \u0445\u0430\u0440\u0438\u043B\u0446\u0430\u0433\u0447\u0442\u0430\u0439 \u0445\u043E\u043B\u0431\u043E\u0441\u043E\u043D \u0431\u0430\u0439\u0445 \u0448\u0430\u0430\u0440\u0434\u043B\u0430\u0433\u0430\u0442\u0430\u0439.

### \u041D\u044D\u0445\u044D\u043C\u0436\u043B\u044D\u0445 (F5)

\u0422\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u0433 \u043D\u044D\u0445\u044D\u043C\u0436\u043B\u044D\u0445\u044D\u044D\u0440 (\u0434\u0430\u043D\u0441\u0430\u0430\u0440) \u0442\u04E9\u043B\u04E9\u0445 \u0431\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u0430\u0434 \u043D\u044D\u0445\u044D\u043C\u0436\u043B\u044D\u0445\u0438\u0439\u043D \u0431\u04AF\u0440\u0442\u0433\u044D\u043B \u04AF\u04AF\u0441\u0433\u044D\u043D\u044D.

### \u0422\u0430\u0442\u0432\u0430\u0440\u0442 \u0418\u043B\u0433\u044D\u044D\u0445

\u0411\u0430\u0440\u0438\u043C\u0442\u0443\u0443\u0434 \u0422\u0415\u0413-\u044B\u043D PosApi-\u0433\u0430\u0430\u0440 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0438\u043B\u0433\u044D\u044D\u0433\u0434\u0434\u044D\u0433. \u0418\u043D\u0442\u0435\u0440\u043D\u044D\u0442 \u0442\u0430\u0441\u0430\u0440\u0441\u0430\u043D \u0437\u044D\u0440\u044D\u0433 \u0448\u0430\u043B\u0442\u0433\u0430\u0430\u043D\u0430\u0430\u0440 \u0438\u043B\u0433\u044D\u044D\u0433\u0434\u044D\u044D\u0433\u04AF\u0439 \u0431\u0430\u0440\u0438\u043C\u0442 \u04AF\u04AF\u0441\u0441\u044D\u043D \u0431\u043E\u043B:

\u0411\u043E\u0440\u043B\u0443\u0443\u043B\u0430\u043B\u0442\u044B\u043D \u0434\u044D\u043B\u0433\u044D\u0446\u0438\u0439\u043D **\u0422\u0430\u0442\u0432\u0430\u0440\u0442 \u0438\u043B\u0433\u044D\u044D\u0445** \u0442\u043E\u0432\u0447 (\u044D\u0441\u0432\u044D\u043B F1 \u041A\u043E\u043C\u043C\u0430\u043D\u0434 \u2192 \u0422\u0430\u0442\u0432\u0430\u0440\u0442 \u0438\u043B\u0433\u044D\u044D\u0445) \u0434\u0430\u0440\u0436 \u0438\u043B\u0433\u044D\u044D\u0433\u0434\u044D\u044D\u0433\u04AF\u0439 \u0431\u0430\u0440\u0438\u043C\u0442\u0443\u0443\u0434\u044B\u0433 \u0434\u0430\u0445\u0438\u043D \u0438\u043B\u0433\u044D\u044D\u043D\u044D.

\u04E8\u0434\u0440\u0438\u0439\u043D \u0442\u04E9\u0433\u0441\u0433\u04E9\u043B \u0431\u04AF\u0440\u0434 \u0438\u043B\u0433\u044D\u044D\u0433\u0434\u044D\u044D\u0433\u04AF\u0439 \u0431\u0430\u0440\u0438\u043C\u0442 \u04AF\u043B\u0434\u0441\u044D\u043D \u044D\u0441\u044D\u0445\u0438\u0439\u0433 \u0448\u0430\u043B\u0433\u0430\u0445 \u0445\u044D\u0440\u044D\u0433\u0442\u044D\u0439; \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u0433\u043E\u043E\u0440 \u04E9\u0434\u04E9\u0440 \u0431\u04AF\u0440 \u0437\u0430\u0430\u0441\u0430\u043D \u0446\u0430\u0433\u0442 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0438\u043B\u0433\u044D\u044D\u0445\u044D\u044D\u0440 \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0436 \u0431\u043E\u043B\u043D\u043E.

`},"pos-return":{t:"\u0411\u0443\u0446\u0430\u0430\u043B\u0442 (Ctrl+B)",b:`
## \u0411\u0443\u0446\u0430\u0430\u043B\u0442 \u0425\u0438\u0439\u0445

**Ctrl+B** (\u044D\u0441\u0432\u044D\u043B F1 \u041A\u043E\u043C\u043C\u0430\u043D\u0434 \u2192 \u0411\u0443\u0446\u0430\u0430\u043B\u0442) \u0434\u0430\u0440\u0436 "\u0411\u0443\u0446\u0430\u0430\u043B\u0442" \u0446\u043E\u043D\u0445\u044B\u0433 \u043D\u044D\u044D\u043D\u044D. \u0413\u0443\u0440\u0432\u0430\u043D \u0442\u04E9\u0440\u043B\u04E9\u04E9\u0440 \u0431\u0443\u0446\u0430\u0430\u043D\u0430:

|\u0422\u04E9\u0440\u04E9\u043B|\u0422\u043E\u0432\u0447\u043B\u043E\u043B|\u0422\u0430\u0439\u043B\u0431\u0430\u0440|
|---|---|---|
|\u0425\u044D\u0441\u044D\u0433\u0447\u0438\u043B\u0436|F2|\u0411\u0430\u0440\u0438\u043C\u0442\u044B\u043D \u0437\u0430\u0440\u0438\u043C \u0431\u0430\u0440\u0430\u0430\u0433 \u0441\u043E\u043D\u0433\u043E\u0436 \u0431\u0443\u0446\u0430\u0430\u043D\u0430|

### \u0414\u0430\u0440\u0430\u0430\u043B\u0430\u043B

\u0411\u0430\u0440\u0438\u043C\u0442\u044B\u0433 **\u0414\u0414\u0422\u0414** (\u0418-\u0411\u0430\u0440\u0438\u043C\u0442\u044B\u043D \u0434\u0430\u0445\u0438\u043D \u0434\u0430\u0432\u0442\u0430\u0433\u0434\u0430\u0448\u0433\u04AF\u0439 \u0434\u0443\u0433\u0430\u0430\u0440) \u044D\u0441\u0432\u044D\u043B **\u0431\u0430\u0440\u0438\u043C\u0442\u044B\u043D \u0434\u0443\u0433\u0430\u0430\u0440\u0430\u0430\u0440** \u0445\u0430\u0439\u043D\u0430.

\u0411\u0443\u0446\u0430\u0430\u0445 \u0431\u0430\u0440\u0430\u0430, \u0442\u043E\u043E \u0445\u044D\u043C\u0436\u044D\u044D\u0433 \u0441\u043E\u043D\u0433\u043E\u043D\u043E; \u0441\u043E\u043B\u0438\u0445 \u0431\u043E\u043B "\u0421\u043E\u043B\u0438\u0436 \u04E9\u0433\u04E9\u0445 \u0431\u0430\u0440\u0430\u0430" \u0445\u044D\u0441\u044D\u0433\u0442 \u0448\u0438\u043D\u044D \u0431\u0430\u0440\u0430\u0430\u0433 \u043E\u0440\u0443\u0443\u043B\u043D\u0430 \u2014 \u0437\u04E9\u0440\u04AF\u04AF \u0434\u04AF\u043D \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0431\u043E\u0434\u043E\u0433\u0434\u043E\u043D\u043E.

**\u0411\u0443\u0446\u0430\u0430\u0445 (F5)** \u0434\u0430\u0440\u043D\u0430 \u2014 \u0431\u0430\u0440\u0430\u0430\u043D\u044B \u04AF\u043B\u0434\u044D\u0433\u0434\u044D\u043B \u043D\u044D\u043C\u044D\u0433\u0434\u044D\u0436, \u0418-\u0411\u0430\u0440\u0438\u043C\u0442 \u0442\u0430\u043B\u0434 \u0431\u0443\u0446\u0430\u0430\u043B\u0442 \u0431\u04AF\u0440\u0442\u0433\u044D\u0433\u0434\u044D\u043D\u044D (ReturnBill).

\u0428\u0430\u0430\u0440\u0434\u043B\u0430\u0433\u0430\u0442\u0430\u0439 \u0431\u043E\u043B \u0431\u0443\u0446\u0430\u0430\u043B\u0442\u044B\u043D \u0431\u0430\u0440\u0438\u043C\u0442\u044B\u0433 A4-\u04E9\u04E9\u0440 \u0445\u044D\u0432\u043B\u044D\u043D\u044D. \u042D\u041C\u0414-\u044D\u044D\u0441 \u0442\u04E9\u043B\u04E9\u0433\u0434\u0441\u04E9\u043D \u0431\u0430\u0440\u0430\u0430\u043D\u044B \u0431\u0443\u0446\u0430\u0430\u043B\u0442 \u043C\u04E9\u043D \u044D\u043D\u0434\u044D\u044D\u0441 \u0445\u0438\u0439\u0433\u0434\u044D\u043D\u044D.

> \u0411\u0430\u043D\u043A\u043D\u044B \u043A\u0430\u0440\u0442\u0430\u0430\u0440 \u0442\u04E9\u043B\u0441\u04E9\u043D \u0433\u04AF\u0439\u043B\u0433\u044D\u044D\u043D\u0438\u0439 \u043C\u04E9\u043D\u0433\u04E9\u043D \u0431\u0443\u0446\u0430\u0430\u043B\u0442\u044B\u0433 **\u0411\u0430\u043D\u043A\u043D\u044B \u041F\u041E\u0421** \u0446\u043E\u043D\u0445\u043D\u044B \u0411\u0443\u0446\u0430\u0430\u043B\u0442 (F3)-\u0430\u0430\u0440 \u0442\u0435\u0440\u043C\u0438\u043D\u0430\u043B \u0434\u044D\u044D\u0440 \u0434\u0430\u0432\u0445\u0430\u0440 \u0445\u0438\u0439\u043D\u044D.
`},"pos-emd":{t:"\u042D\u041C\u0414 \u2014 \u042D\u043C\u0438\u0439\u043D \u0421\u0430\u043D\u0433\u0438\u0439\u043D \u04AE\u0439\u043B\u0447\u0438\u043B\u0433\u044D\u044D",b:`
## \u042D\u0440\u04AF\u04AF\u043B \u041C\u044D\u043D\u0434\u0438\u0439\u043D \u0414\u0430\u0430\u0442\u0433\u0430\u043B\u044B\u043D \u0411\u043E\u043B\u043E\u043C\u0436\u0443\u0443\u0434

\u042D\u0440\u04AF\u04AF\u043B \u043C\u044D\u043D\u0434\u0438\u0439\u043D \u0434\u0430\u0430\u0442\u0433\u0430\u043B\u044B\u043D \u0433\u044D\u0440\u044D\u044D\u0442 \u044D\u043C\u0438\u0439\u043D \u0441\u0430\u043D\u0433\u0443\u0443\u0434\u0430\u0434 \u0437\u043E\u0440\u0438\u0443\u043B\u0441\u0430\u043D \u0431\u043E\u043B\u043E\u043C\u0436\u0443\u0443\u0434:

### \u0426\u0430\u0445\u0438\u043C \u0416\u043E\u0440 (F2)

**F2 (\u042D\u041C\u0414 \u0416\u041E\u0420)** \u0434\u0430\u0440\u0436 "\u0425\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447\u0438\u0439\u043D \u043C\u044D\u0434\u044D\u044D\u043B\u044D\u043B" \u0446\u043E\u043D\u0445\u044B\u0433 \u043D\u044D\u044D\u043D\u044D.

\u0425\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447\u0438\u0439\u043D **\u0440\u0435\u0433\u0438\u0441\u0442\u0440** \u044D\u0441\u0432\u044D\u043B **\u0436\u043E\u0440\u044B\u043D \u0434\u0443\u0433\u0430\u0430\u0440\u0430\u0430\u0440** \u042D\u041C\u0414-\u044B\u043D \u0446\u0430\u0445\u0438\u043C \u0441\u0438\u0441\u0442\u0435\u043C\u044D\u044D\u0441 \u0436\u043E\u0440\u044B\u0433 \u0442\u0430\u0442\u043D\u0430 \u2014 \u043E\u043D\u043E\u0448, \u044D\u043C\u0447 (\u0448\u0438\u0444\u0440), \u0431\u0438\u0447\u0438\u0433\u0434\u0441\u044D\u043D \u044D\u043C\u043D\u04AF\u04AF\u0434 \u0445\u0430\u0440\u0430\u0433\u0434\u0430\u043D\u0430.

\u0416\u043E\u0440\u044B\u043D \u044D\u043C\u043D\u04AF\u04AF\u0434\u0438\u0439\u0433 \u0431\u0438\u043B\u043B \u0440\u04AF\u04AF \u043E\u0440\u0443\u0443\u043B\u0430\u0445\u0430\u0434 \u042D\u041C\u0414-\u044B\u043D **\u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442\u0438\u0439\u043D \u0434\u04AF\u043D** (*\u042D\u041C\u0414-\u0441* \u0431\u0430\u0433\u0430\u043D\u0430) \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0431\u043E\u0434\u043E\u0433\u0434\u043E\u0436, \u0445\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447 \u0437\u04E9\u0432\u0445\u04E9\u043D \u04E9\u04E9\u0440\u0438\u0439\u043D \u0442\u04E9\u043B\u04E9\u0445 \u0445\u044D\u0441\u0433\u0438\u0439\u0433 \u0442\u04E9\u043B\u043D\u04E9. 100% \u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442\u0442\u044D\u0439 \u044D\u043C\u0438\u0439\u0433 \u0448\u0430\u043B\u0433\u0430\u0445 \u0431\u043E\u043B\u043E\u043C\u0436\u0442\u043E\u0439.

**\u0425\u042D\u0411-\u044D\u044D\u0440 \u04AF\u0439\u043B\u0447\u043B\u04AF\u04AF\u043B\u044D\u0445 (F2)** \u0447\u0435\u043A \u2014 \u0445\u0438\u0448\u0438\u0433, \u044D\u0440\u04AF\u04AF\u043B \u043C\u044D\u043D\u0434\u0438\u0439\u043D \u0431\u0430\u0433\u0446 (\u0425\u042D\u0411) \u043A\u0430\u0440\u0442\u0430\u0430\u0440 \u04AF\u0439\u043B\u0447\u043B\u044D\u0445\u044D\u0434 \u0438\u0434\u044D\u0432\u0445\u0436\u04AF\u04AF\u043B\u043D\u044D.

### \u0426\u0430\u0430\u0441\u0430\u043D \u0416\u043E\u0440 (Ctrl+F2)

\u0426\u0430\u0445\u0438\u043C \u0431\u0443\u0441 (\u0446\u0430\u0430\u0441\u0430\u043D) \u0436\u043E\u0440\u044B\u0433 **Ctrl+F2**-\u043E\u043E\u0440 \u0431\u04AF\u0440\u0442\u0433\u044D\u0436 \u043C\u044D\u0434\u044D\u044D\u0433 \u04AF\u04AF\u0441\u0433\u044D\u043D\u044D; \u0436\u0430\u0433\u0441\u0430\u0430\u043B\u0442\u044B\u0433 F1 \u041A\u043E\u043C\u043C\u0430\u043D\u0434 \u2192 *\u0426\u0430\u0430\u0441\u0430\u043D \u0436\u043E\u0440\u044B\u043D \u0431\u04AF\u0440\u0442\u0433\u044D\u043B \u043C\u044D\u0434\u044D\u044D*-\u0433\u044D\u044D\u0441 \u0445\u0430\u0440\u043D\u0430.

### \u042D\u041C\u0414 \u0413\u04AF\u0439\u043B\u0433\u044D\u044D \u0428\u0430\u043B\u0433\u0430\u0445, \u0418\u043B\u0433\u044D\u044D\u0445

## \u0414\u044D\u043B\u0433\u04AF\u04AF\u0440 \u041D\u044D\u044D\u0445

\u0422\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u0433\u043E\u043E\u0440 \u0438\u0434\u044D\u0432\u0445\u0436\u0441\u044D\u043D \u0431\u043E\u043B \u04E9\u0434\u0440\u0438\u0439\u043D \u044D\u0445\u044D\u043D\u0434 **F1 \u2192 \u0414\u044D\u043B\u0433\u04AF\u04AF\u0440 \u043D\u044D\u044D\u0445** \u2014 \u043D\u044D\u044D\u0441\u044D\u043D \u0446\u0430\u0433\u0430\u0430\u0441 \u0445\u043E\u0439\u0448\u0445 \u0433\u04AF\u0439\u043B\u0433\u044D\u044D \u0442\u0443\u0445\u0430\u0439\u043D \u044D\u044D\u043B\u0436\u0438\u0434 \u0431\u04AF\u0440\u0442\u0433\u044D\u0433\u0434\u044D\u043D\u044D.

## \u04E8\u0434\u0440\u0438\u0439\u043D \u0422\u0430\u0439\u043B\u0430\u043D (X \u0422\u0430\u0439\u043B\u0430\u043D)

**F1 \u041A\u043E\u043C\u043C\u0430\u043D\u0434 \u2192 \u04E8\u0434\u0440\u0438\u0439\u043D \u0445\u0430\u0430\u043B\u0442 (F8)** \u0446\u043E\u043D\u0445\u043D\u044B **"\u04E8\u0434\u0440\u0438\u0439\u043D \u0442\u0430\u0439\u043B\u0430\u043D (F2)"** \u0442\u0430\u0431 \u2014 \u0445\u0430\u0430\u043B\u0442 \u0445\u0438\u0439\u0445\u0433\u04AF\u0439\u0433\u044D\u044D\u0440 \u0431\u043E\u0440\u043B\u0443\u0443\u043B\u0430\u043B\u0442\u0430\u0430 \u0445\u044F\u043D\u0430\u043D\u0430:

- \u0425\u0443\u0433\u0430\u0446\u0430\u0430\u043D\u044B \u0441\u043E\u043D\u0433\u043E\u043B\u0442: **\u04E8\u043D\u04E9\u04E9\u0434\u04E9\u0440 / \u04E8\u043C\u043D\u04E9\u0445 \u0445\u0443\u0433\u0430\u0446\u0430\u0430 / \u0414\u0443\u0440\u044B\u043D \u0445\u0443\u0433\u0430\u0446\u0430\u0430**
- **\u0414\u044D\u043B\u0433\u044D\u0440\u044D\u043D\u0433\u04AF\u0439 \u0442\u0430\u0439\u043B\u0430\u043D (F7)** \u2014 \u0433\u04AF\u0439\u043B\u0433\u044D\u044D \u0431\u04AF\u0440\u044D\u044D\u0440
- **\u0425\u0443\u0440\u0430\u0430\u043D\u0433\u0443\u0439 \u0442\u0430\u0439\u043B\u0430\u043D (F8)** \u2014 \u0442\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u043D \u0442\u04E9\u0440\u043B\u04E9\u04E9\u0440 \u043D\u044D\u0433\u0442\u0433\u044D\u0441\u044D\u043D
- **\u0425\u0443\u0440\u0430\u0430\u043D\u0433\u0443\u0439 \u0442\u0430\u0439\u043B\u0430\u043D /\u0431\u0430\u0440\u0430\u0430\u0433\u0430\u0430\u0440/ (F9)** \u2014 \u0431\u0430\u0440\u0430\u0430\u043D\u044B \u043D\u044D\u0440 \u0442\u04E9\u0440\u043B\u04E9\u04E9\u0440 \u043D\u044D\u0433\u0442\u0433\u044D\u0441\u044D\u043D

## \u04E8\u0434\u0440\u0438\u0439\u043D \u0425\u0430\u0430\u043B\u0442 (Z \u0422\u0430\u0439\u043B\u0430\u043D)

\u0410\u0436\u043B\u044B\u043D \u04E9\u0434\u0440\u0438\u0439\u043D \u0442\u04E9\u0433\u0441\u0433\u04E9\u043B\u0434 **"\u0425\u0430\u0430\u043B\u0442 \u0445\u0438\u0439\u0445 (F3)"** \u0442\u0430\u0431 \u0440\u0443\u0443 \u043E\u0440\u0436:

- **\u0425\u0430\u0430\u0433\u0434\u0430\u0430\u0433\u04AF\u0439 \u0431\u0438\u043B\u043B** \u0442\u0430\u0431\u044B\u0433 \u0448\u0430\u043B\u0433\u0430\u043D\u0430 \u2014 \u0434\u0443\u0443\u0441\u0430\u0430\u0433\u04AF\u0439 \u0431\u0438\u043B\u043B \u0431\u0430\u0439\u0432\u0430\u043B (\u0411\u0430\u0440\u0438\u043C\u0442 \u2116, \u0428\u0438\u0440\u044D\u044D \u2116, \u0414\u04AF\u043D) \u0431\u0443\u0446\u0430\u0436 \u0445\u0430\u0430\u043D\u0430 \u044D\u0441\u0432\u044D\u043B \u0446\u0443\u0446\u0430\u043B\u043D\u0430
- \u0411\u044D\u043B\u044D\u043D \u043C\u04E9\u043D\u0433\u04E9\u04E9 \u0442\u043E\u043E\u043B\u0436 **\u0434\u044D\u0432\u0441\u0433\u044D\u0440\u0442\u0438\u0439\u043D \u0442\u043E\u043E\u043B\u043B\u043E\u0433\u044B\u043D** \u0445\u04AF\u0441\u043D\u044D\u0433\u0442\u044D\u0434 \u0434\u044D\u0432\u0441\u0433\u044D\u0440\u0442 \u0442\u0443\u0441 \u0431\u04AF\u0440\u0438\u0439\u043D \u0442\u043E\u043E\u0433 \u043E\u0440\u0443\u0443\u043B\u043D\u0430 \u2014 \u043D\u0438\u0439\u0442 \u0434\u04AF\u043D \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0431\u043E\u0434\u043E\u0433\u0434\u043E\u043D\u043E
- **\u041C\u04E9\u043D\u0433\u04E9 \u0442\u0443\u0448\u0430\u0430\u0433\u0447**-\u0438\u0439\u043D \u043D\u044D\u0440\u0438\u0439\u0433 \u0441\u043E\u043D\u0433\u043E\u043D\u043E
- **\u04E8\u0434\u0440\u0438\u0439\u043D \u0445\u0430\u0430\u043B\u0442 \u0445\u0438\u0439\u0445 (F6)** \u0434\u0430\u0440\u043D\u0430 \u2014 \u044D\u044D\u043B\u0436\u0438\u0439\u043D \u043E\u0440\u043B\u043E\u0433\u043E \u0442\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u043D \u0442\u04E9\u0440\u04E9\u043B \u0442\u0443\u0441 \u0431\u04AF\u0440\u044D\u044D\u0440 (\u0431\u044D\u043B\u044D\u043D, \u043A\u0430\u0440\u0442, QPay, \u0437\u044D\u044D\u043B\u2026) \u043D\u044D\u0433\u0442\u0433\u044D\u0433\u0434\u044D\u0436, \u043D\u044F\u0433\u0442\u043B\u0430\u043D\u0433\u0438\u0439\u043D \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u044B\u043D \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0441\u0430\u043D \u0434\u0430\u043D\u0441\u0434\u0430\u0434 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0431\u0438\u0447\u0438\u0433\u0434\u044D\u043D\u044D

\u0425\u0430\u0430\u043B\u0442\u044B\u043D \u0431\u0430\u0440\u0438\u043C\u0442 \u0445\u044D\u0432\u043B\u044D\u0433\u0434\u044D\u043D\u044D \u2014 \u0442\u043E\u043E\u043B\u0441\u043E\u043D \u0431\u044D\u043B\u044D\u043D \u043C\u04E9\u043D\u0433\u04E9 \u0431\u043E\u043B\u043E\u043D \u0441\u0438\u0441\u0442\u0435\u043C\u0438\u0439\u043D \u0434\u04AF\u043D\u0433\u0438\u0439\u043D \u0437\u04E9\u0440\u04AF\u04AF\u0433 \u0430\u0445\u043B\u0430\u0445\u0442\u0430\u0439\u0433\u0430\u0430 \u0442\u0443\u043B\u0433\u0430\u043D\u0430.

> **\u0410\u043D\u0445\u0430\u0430\u0440:**
> - \u0411\u0430\u043D\u043A\u043D\u044B \u0442\u0435\u0440\u043C\u0438\u043D\u0430\u043B\u0442\u0430\u0439 \u0431\u043E\u043B \u0442\u0435\u0440\u043C\u0438\u043D\u0430\u043B\u044B\u043D **\u04E8\u0434\u0440\u0438\u0439\u043D \u0445\u0430\u0430\u043B\u0442 (Settlement)**-\u0438\u0439\u0433 \u0411\u0430\u043D\u043A\u043D\u044B \u041F\u041E\u0421 \u0446\u043E\u043D\u0445\u043D\u043E\u043E\u0441 (F5) \u0434\u0430\u0432\u0445\u0430\u0440 \u0445\u0438\u0439\u0436, \u0442\u0435\u0440\u043C\u0438\u043D\u0430\u043B\u044B\u043D \u0442\u0430\u0439\u043B\u0430\u043D\u0433\u0438\u0439\u043D POS-\u044B\u043D \u043A\u0430\u0440\u0442\u044B\u043D \u0434\u04AF\u043D\u0442\u044D\u0439 \u0442\u0443\u043B\u0433\u0430\u043D\u0430.
> - **\u0418\u043B\u0433\u044D\u044D\u0433\u0434\u044D\u044D\u0433\u04AF\u0439 \u0418-\u0411\u0430\u0440\u0438\u043C\u0442, \u042D\u041C\u0414** \u0433\u04AF\u0439\u043B\u0433\u044D\u044D \u0431\u0430\u0439\u0433\u0430\u0430 \u044D\u0441\u044D\u0445\u0438\u0439\u0433 \u0445\u0430\u0430\u043B\u0442\u044B\u043D \u04E9\u043C\u043D\u04E9 \u0448\u0430\u043B\u0433\u0430\u043D\u0430.

### \u0422\u0430\u0439\u043B\u0430\u043D\u0433\u0443\u0443\u0434 \u0411\u04AF\u043B\u044D\u0433

**\u0422\u0430\u043D\u0445\u0438\u043C\u0430\u0430** \u0441\u043E\u043D\u0433\u043E\u0436 (\u043E\u043B\u043E\u043D \u0442\u0430\u043D\u0445\u0438\u043C\u0442\u0430\u0439 \u0431\u043E\u043B), \u0441\u0443\u043B **\u0448\u0438\u0440\u044D\u044D** \u0434\u044D\u044D\u0440 \u0434\u0430\u0440\u043D\u0430 \u2014 \u0442\u0443\u0445\u0430\u0439\u043D \u0448\u0438\u0440\u044D\u044D\u043D\u0434 \u0431\u0438\u043B\u043B \u04AF\u04AF\u0441\u043D\u044D.

\u0417\u0430\u0445\u0438\u0430\u043B\u0433\u0430\u0442\u0430\u0439 \u0437\u043E\u0447\u0438\u043D \u0431\u043E\u043B **\u0417\u0430\u0445\u0438\u0430\u043B\u0433\u0430 \u0445\u043E\u043B\u0431\u043E\u0445** \u0442\u043E\u0432\u0447\u043E\u043E\u0440 \u0443\u0440\u044C\u0434\u0447\u0438\u043B\u0441\u0430\u043D \u0437\u0430\u0445\u0438\u0430\u043B\u0433\u044B\u0433 \u0431\u0438\u043B\u043B\u0442\u044D\u0439 \u0445\u043E\u043B\u0431\u043E\u043D\u043E.

\u0428\u0430\u0430\u0440\u0434\u043B\u0430\u0433\u0430\u0442\u0430\u0439 \u0431\u043E\u043B \u0437\u043E\u0447\u043D\u044B\u0433 (**\u04AE\u0439\u043B\u0447\u043B\u04AF\u04AF\u043B\u044D\u0433\u0447** \u0441\u043E\u043D\u0433\u043E\u0445) \u0431\u043E\u043B\u043E\u043D \u04AF\u0439\u043B\u0447\u0438\u043B\u0436 \u0431\u0443\u0439 **\u0437\u04E9\u04E9\u0433\u0447/\u0430\u0436\u0438\u043B\u0442\u043D\u044B\u0433** \u0431\u0438\u043B\u043B\u0442\u044D\u0439 \u0445\u043E\u043B\u0431\u043E\u043D\u043E \u2014 \u0430\u0436\u0438\u043B\u0442\u043D\u044B \u0431\u043E\u0440\u043B\u0443\u0443\u043B\u0430\u043B\u0442\u044B\u043D \u0442\u0430\u0439\u043B\u0430\u043D\u0434 \u0442\u0443\u0441\u0433\u0430\u0433\u0434\u0430\u043D\u0430.

\u0411\u0438\u043B\u043B\u0434 \u0445\u043E\u043E\u043B, \u0443\u043D\u0434\u0430\u0430\u0433\u0430\u0430 \u043D\u044D\u043C\u043D\u044D (\u0431\u0430\u0440\u043A\u043E\u0434, \u0445\u0430\u0439\u043B\u0442, \u044D\u0441\u0432\u044D\u043B \u0434\u044D\u043B\u0433\u044D\u0446\u0438\u0439\u043D \u0446\u044D\u0441\u043D\u044D\u044D\u0441). \u0422\u043E\u043E\u0433 **+ / \u2212** \u0442\u043E\u0432\u0447\u043E\u043E\u0440 \u04E9\u04E9\u0440\u0447\u0438\u043B\u043D\u04E9, \u043C\u04E9\u0440\u0438\u0439\u0433 Delete-\u044D\u044D\u0440 \u0443\u0441\u0442\u0433\u0430\u043D\u0430.

**\u0413\u0430\u043B \u0442\u043E\u0433\u043E\u043E\u043D\u044B \u0431\u0438\u043B\u043B** \u0434\u0430\u0440\u0430\u0445\u0430\u0434 \u0431\u0430\u0440\u0430\u0430 \u0442\u0443\u0441 \u0431\u04AF\u0440 **\u0445\u0430\u043C\u0430\u0430\u0440\u0430\u0445 \u0433\u0430\u043B \u0442\u043E\u0433\u043E\u043E, \u043F\u0440\u0438\u043D\u0442\u0435\u0440** \u0434\u044D\u044D\u0440\u044D\u044D \u0445\u0443\u0432\u0430\u0430\u0440\u0438\u043B\u0430\u0433\u0434\u0430\u043D \u0445\u0430\u0440\u0430\u0433\u0434\u0430\u043D\u0430 \u2014 **\u0425\u044D\u0432\u043B\u044D\u0445 (F6)** \u0434\u0430\u0440\u0436 \u0437\u0430\u0445\u0438\u0430\u043B\u0433\u044B\u0433 \u0433\u0430\u043B \u0442\u043E\u0433\u043E\u043E\u043D\u0443\u0443\u0434\u0430\u0434 \u0438\u043B\u0433\u044D\u044D\u043D\u044D (\u0445\u043E\u043E\u043B\u043D\u044B \u0442\u04E9\u0440\u043B\u04E9\u04E9\u0441 \u0445\u0430\u043C\u0430\u0430\u0440\u0447 \u0430\u043B\u044C \u0433\u0430\u043B \u0442\u043E\u0433\u043E\u043E\u043D\u044B \u043F\u0440\u0438\u043D\u0442\u0435\u0440 \u0434\u044D\u044D\u0440 \u0445\u044D\u0432\u043B\u044D\u0433\u0434\u044D\u0445 \u043D\u044C \u043B\u0430\u0432\u043B\u0430\u0445\u044B\u043D \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u0433\u043E\u043E\u0440 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0448\u0438\u0439\u0434\u044D\u0433\u0434\u044D\u043D\u044D).

## \u0426\u0430\u0433 \u0417\u0430\u0445\u0438\u0430\u043B\u0433\u044B\u043D \u0423\u0434\u0438\u0440\u0434\u043B\u0430\u0433\u0430

\u04AE\u0439\u043B\u0447\u0438\u043B\u0433\u044D\u044D\u043D\u0438\u0439 \u0446\u0430\u0433 \u0437\u0430\u0445\u0438\u0430\u043B\u0433\u044B\u0433 **\u0417\u0410\u0425\u0418\u0410\u041B\u0413\u0410 (Ctrl+Z)** \u0446\u043E\u043D\u0445\u043E\u043E\u0440 \u0443\u0434\u0438\u0440\u0434\u0430\u043D\u0430:

\u0425\u0443\u0430\u043D\u043B\u0438\u0439\u043D \u0445\u0430\u0440\u0430\u0433\u0434\u0430\u0446: **\u04E8\u0434\u04E9\u0440 / \u0414\u043E\u043B\u043E\u043E \u0445\u043E\u043D\u043E\u0433 / \u0421\u0430\u0440 / \u041E\u043D**; \u0431\u0430\u0433\u0430\u043D\u0430 \u0431\u04AF\u0440 \u043D\u044C **\u0430\u0436\u0438\u043B\u0442\u0430\u043D** (\u0440\u0435\u0441\u0443\u0440\u0441).

**\u0428\u0438\u043D\u044D \u0437\u0430\u0445\u0438\u0430\u043B\u0433\u0430** \u2014 \u0437\u043E\u0447\u043D\u044B \u043D\u044D\u0440, \u0443\u0442\u0430\u0441, \u0448\u0438\u0440\u044D\u044D/\u04E9\u0440\u04E9\u04E9, \u0446\u0430\u0433, \u0443\u0440\u044C\u0434\u0447\u0438\u043B\u0433\u0430\u0430\u0433 \u0431\u04AF\u0440\u0442\u0433\u044D\u043D\u044D.

\u0417\u0430\u0445\u0438\u0430\u043B\u0433\u0430 **\u0446\u0443\u0446\u043B\u0430\u0445**, \u04E9\u0440\u04E9\u04E9\u043D\u0438\u0439 \u0445\u0443\u0432\u0430\u0430\u0440\u044C \u0445\u0430\u0440\u0430\u0445, **\u0417\u0430\u0445\u0438\u0430\u043B\u0433\u0430 \u0436\u0430\u0433\u0441\u0430\u0430\u043B\u0442\u0430\u0430\u0440** \u0431\u043E\u043B\u043E\u043D **\u0417\u0430\u0445\u0438\u0430\u043B\u0433\u044B\u043D \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A** \u0442\u0430\u0439\u043B\u0430\u043D\u0433\u0443\u0443\u0434 F1 \u0446\u044D\u0441\u043D\u044D\u044D\u0441.

\u0426\u0430\u0433\u0430\u0430\u0440 \u04AF\u043D\u044D\u043B\u0434\u044D\u0433 \u04AF\u0439\u043B\u0447\u0438\u043B\u0433\u044D\u044D\u043D\u0434 (\u043A\u0430\u0440\u0430\u043E\u043A\u0435, \u04E9\u0440\u04E9\u04E9, \u0442\u043E\u0433\u043B\u043E\u043E\u043C) **\u0422\u043E\u043E\u0446\u043E\u043E (\u0446\u0430\u0433 \u044D\u0445\u043B\u04AF\u04AF\u043B\u044D\u0445)** \u0442\u043E\u0432\u0447\u043E\u043E\u0440 \u044D\u0445\u043B\u044D\u0445 \u0446\u0430\u0433\u0438\u0439\u0433 \u0431\u04AF\u0440\u0442\u0433\u044D\u0436, \u0434\u0443\u0443\u0441\u0430\u0445\u0430\u0434 \u04AF\u0440\u0433\u044D\u043B\u0436\u0438\u043B\u0441\u044D\u043D \u0446\u0430\u0433/\u043C\u0438\u043D\u0443\u0442\u0430\u0430\u0440 \u04AF\u043D\u044D \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u0431\u043E\u0434\u043E\u0433\u0434\u043E\u043D\u043E.

## Duty Free \u0413\u043E\u0440\u0438\u043C

Duty Free \u0433\u043E\u0440\u0438\u043C \u043D\u044C \u0436\u0438\u0436\u0438\u0433\u043B\u044D\u043D\u0433\u0438\u0439\u043D \u0434\u044D\u043B\u0433\u044D\u0446\u0442\u044D\u0439 \u0438\u0436\u0438\u043B \u0431\u043E\u043B\u043E\u0432\u0447 **\u0442\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u0433 \u043E\u043B\u043E\u043D \u0432\u0430\u043B\u044E\u0442\u0430\u0430\u0440** \u0430\u0432\u0434\u0433\u0430\u0430\u0440\u0430\u0430 \u044F\u043B\u0433\u0430\u0430\u0442\u0430\u0439:

\u0422\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u043D \u0446\u043E\u043D\u0445\u043E\u043D\u0434 \u0432\u0430\u043B\u044E\u0442 \u0442\u0443\u0441 \u0431\u04AF\u0440\u044D\u044D\u0440 \u043C\u04E9\u0440 \u043D\u044D\u043C\u043D\u044D: **\u0412\u0430\u043B\u044E\u0442, \u0425\u0430\u043D\u0448, \u0425\u044D\u043B\u0431\u044D\u0440 (\u0431\u044D\u043B\u044D\u043D/\u043A\u0430\u0440\u0442), \u0410\u0432\u0441\u0430\u043D \u0434\u04AF\u043D** \u2014 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C **\u041D\u0438\u0439\u0442 (\u0442\u04E9\u0433\u0440\u04E9\u0433)** \u0434\u04AF\u043D\u0433 \u0445\u0430\u043D\u0448\u0430\u0430\u0440 \u0431\u043E\u0434\u043D\u043E.

\u041D\u044D\u0433 \u0431\u0438\u043B\u043B\u0438\u0439\u0433 \u0445\u044D\u0434 \u0445\u044D\u0434\u044D\u043D \u0432\u0430\u043B\u044E\u0442\u0430\u0430\u0440 \u0445\u043E\u043B\u0438\u043C\u043E\u0433 \u0442\u04E9\u043B\u0436 \u0431\u043E\u043B\u043D\u043E (\u0436\u0438\u0448\u044D\u044D \u043D\u044C \u0434\u043E\u043B\u043B\u0430\u0440 + \u0442\u04E9\u0433\u0440\u04E9\u0433 + \u043A\u0430\u0440\u0442).

**\u0425\u0430\u0440\u0438\u0443\u043B\u0442** (\u0445\u0430\u0440\u0438\u0445 \u043C\u04E9\u043D\u0433\u04E9) \u0441\u043E\u043D\u0433\u043E\u0441\u043E\u043D \u0432\u0430\u043B\u044E\u0442\u0430\u0430\u0440 \u0431\u043E\u0434\u043E\u0433\u0434\u043E\u043D\u043E.

**\u0411\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u0430 \u0431\u043E\u043B (F3)**, \u0445\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447 \u043D\u044D\u043C\u044D\u0445 (+), **\u0425\u044D\u0432\u043B\u044D\u0445** \u2014 \u0436\u0438\u0436\u0438\u0433\u043B\u044D\u043D\u0433\u0438\u0439\u043D\u0445\u0442\u044D\u0439 \u0438\u0436\u0438\u043B.

> **\u0410\u043D\u0445\u0430\u0430\u0440:** \u0412\u0430\u043B\u044E\u0442\u044B\u043D **\u0445\u0430\u043D\u0448** \u043E\u0440\u0443\u0443\u043B\u0430\u0430\u0433\u04AF\u0439 \u044D\u0441\u0432\u044D\u043B **\u04AF\u043D\u0434\u0441\u044D\u043D (default) \u0432\u0430\u043B\u044E\u0442** \u0441\u043E\u043D\u0433\u043E\u043E\u0433\u04AF\u0439 \u0431\u043E\u043B \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C \u0442\u04E9\u043B\u0431\u04E9\u0440\u0438\u0439\u0433 \u0445\u04AF\u043B\u044D\u044D\u0436 \u0430\u0432\u0430\u0445\u0433\u04AF\u0439 ("\u0421\u043E\u043D\u0433\u043E\u0441\u043E\u043D \u0432\u0430\u043B\u044E\u0442\u044B\u043D \u0445\u0430\u043D\u0448 \u043E\u0440\u0443\u0443\u043B\u0430\u0430\u0433\u04AF\u0439 \u0431\u0430\u0439\u043D\u0430" / "Default \u0432\u0430\u043B\u044E\u0442 \u0441\u043E\u043D\u0433\u043E\u043E\u0433\u04AF\u0439 \u0431\u0430\u0439\u043D\u0430"). \u04E8\u0434\u0440\u0438\u0439\u043D \u0445\u0430\u043D\u0448\u0438\u0439\u0433 \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0441\u0430\u043D \u044D\u0441\u044D\u0445\u044D\u044D \u044D\u044D\u043B\u0436\u0438\u0439\u043D \u044D\u0445\u044D\u043D\u0434 \u0448\u0430\u043B\u0433\u0430\u043D\u0430.
`},"pos-admin":{t:"POS-\u044B\u043D \u0422\u043E\u0445\u0438\u0440\u0433\u043E\u043E (\u0410\u0434\u043C\u0438\u043D\u0434)",b:`
## \u0415\u0440\u04E9\u043D\u0445\u0438\u0439 \u0422\u043E\u0445\u0438\u0440\u0433\u043E\u043E

**F1 \u2192 \u041F\u041E\u0421 \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E** ("POS-\u043D \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u044B\u043D \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E") \u2014 \u044D\u044D\u043B\u0436\u0438\u0439\u043D \u0430\u0445\u043B\u0430\u0433\u0447/\u0430\u0434\u043C\u0438\u043D\u0434 \u0437\u043E\u0440\u0438\u0443\u043B\u0441\u0430\u043D \u0433\u043E\u043B \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E\u043D\u0443\u0443\u0434:

### \u04AE\u043D\u0434\u0441\u044D\u043D \u0422\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0433\u0443\u0443\u0434

**POS \u2116** \u2014 \u043A\u0430\u0441\u0441\u044B\u043D \u0434\u0443\u0433\u0430\u0430\u0440 (\u043E\u043B\u043E\u043D \u043A\u0430\u0441\u0441\u0430\u043D\u0434 \u0442\u0443\u0441 \u0431\u04AF\u0440 \u04E9\u04E9\u0440).

**\u04AE\u043D\u044D/\u0442\u043E\u043E/\u0445\u04E9\u043D\u0433\u04E9\u043B\u04E9\u043B\u0442 \u0433\u0430\u0440\u0430\u0430\u0440 \u0437\u0430\u0441\u0430\u0445 \u044D\u0440\u0445**, \u0442\u043E\u043E 0 \u0431\u043E\u043B\u043E\u0445\u043E\u0434 \u043C\u04E9\u0440 \u0443\u0441\u0442\u0433\u0430\u0445, \u04AF\u043B\u0434\u044D\u0433\u0434\u044D\u043B \u0448\u0430\u043B\u0433\u0430\u0445 (\u04AF\u043B\u0434\u044D\u0433\u0434\u044D\u043B\u0433\u04AF\u0439 \u0431\u0430\u0440\u0430\u0430\u0433 \u0437\u0430\u0440\u0430\u0445\u044B\u0433 \u0445\u043E\u0440\u0438\u0433\u043B\u043E\u0445).

**\u041F\u0440\u0438\u043D\u0442\u0435\u0440\u0438\u0439\u043D \u0446\u0430\u0430\u0441\u043D\u044B \u04E9\u0440\u0433\u04E9\u043D**, \u0442\u0430\u043B\u043E\u043D\u044B \u0437\u0430\u0433\u0432\u0430\u0440 (\u0444\u0430\u0439\u043B\u0430\u0430\u0441), \u043A\u0438\u0440\u0438\u043B\u043B\u2192\u043B\u0430\u0442\u0438\u043D \u0445\u04E9\u0440\u0432\u04AF\u04AF\u043B\u044D\u043B\u0442, \u0442\u043E\u0432\u0447\u0438\u043B\u0441\u043E\u043D \u043D\u044D\u0440\u044D\u044D\u0440 \u0445\u044D\u0432\u043B\u044D\u0445, \u0434\u0430\u0445\u0438\u043D \u0445\u044D\u0432\u043B\u044D\u0445 \u0437\u04E9\u0432\u0448\u04E9\u04E9\u0440\u04E9\u043B.

**\u0425\u044D\u0440\u044D\u0433\u043B\u044D\u0433\u0447\u0438\u0439\u043D \u0434\u044D\u043B\u0433\u044D\u0446** (COM \u043F\u043E\u0440\u0442) \u0431\u0430 **Promo \u0434\u044D\u043B\u0433\u044D\u0446** \u2014 \u0445\u0443\u0434\u0430\u043B\u0434\u0430\u043D \u0430\u0432\u0430\u0433\u0447\u0438\u0434 \u0445\u0430\u0440\u0443\u0443\u043B\u0430\u0445 \u0441\u0443\u0440\u0442\u0430\u043B\u0447\u0438\u043B\u0433\u0430\u0430\u043D\u044B \u0437\u0443\u0440\u0430\u0433, \u0441\u043E\u043B\u0438\u0433\u0434\u043E\u0445 \u0445\u0443\u0433\u0430\u0446\u0430\u0430.

**\u0414\u042D\u041B\u0413\u04AE\u04AE\u0420 \u041D\u042D\u042D\u0425 \u043A\u043E\u043C\u0430\u043D\u0434 \u0430\u0448\u0438\u0433\u043B\u0430\u0445**, \u0448\u0438\u043D\u044D \u0431\u0438\u043B\u043B \u043A\u043E\u043C\u0430\u043D\u0434, \u041D\u0425\u0410\u0422/\u041D\u04E8\u0410\u0422 \u0442\u043E\u043E\u0446\u043E\u0445 \u0430\u0440\u0433\u0430, \u0425\u042D\u0411 \u043A\u0430\u0440\u0442 \u0438\u0434\u044D\u0432\u0445\u0436\u04AF\u04AF\u043B\u044D\u0445.

### \u0411\u0430\u0440\u0430\u0430\u043D\u044B \u0422\u0430\u0441\u0430\u0433 \u0411\u0430 \u0414\u0430\u043D\u0441\u043D\u044B \u0425\u043E\u043B\u0431\u043E\u043B\u0442

## \u0426\u0430\u043B\u0438\u043D \u0426\u044D\u0441

\u0426\u0430\u043B\u0438\u043D \u0431\u043E\u0434\u043E\u0445 \u0431\u0430 \u0446\u0430\u043B\u0438\u043D\u0442\u0430\u0439 \u0445\u043E\u043B\u0431\u043E\u043E\u0442\u043E\u0439 \u043D\u044F\u0433\u0442\u043B\u0430\u043D \u0431\u043E\u0434\u043E\u0445 \u0431\u04AF\u0440\u0442\u0433\u044D\u043B\u0438\u0439\u043D \u0436\u0443\u0440\u043D\u0430\u043B \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u04AF\u04AF\u0441\u043D\u044D. \u0422\u04AF\u04AF\u043D\u0447\u043B\u044D\u043D \u0446\u0430\u043B\u0438\u043D\u0433\u0438\u0439\u043D \u0431\u0430\u0440\u0438\u043C\u0442 \u0431\u043E\u043B\u043E\u043D \u0442\u0430\u0439\u043B\u0430\u043D\u0433\u0443\u0443\u0434\u044B\u0433 \u043E\u0440\u043E\u043D \u0442\u043E\u043E, \u0445\u044D\u043B\u0442\u044D\u0441 \u0442\u0430\u0441\u0430\u0433, \u0430\u0436\u0438\u043B\u0442\u043D\u0430\u0430\u0440 \u0445\u0430\u0440\u0430\u0445 \u0431\u043E\u043B\u043E\u043C\u0436\u0442\u043E\u0439.

\u0426\u0430\u043B\u0438\u043D\u0433 \u0431\u043E\u0434\u043E\u0445\u044B\u043D \u04E9\u043C\u043D\u04E9 \u0446\u0430\u043B\u0438\u043D \u0431\u043E\u0434\u043E\u0445\u0442\u043E\u0439 \u0445\u043E\u043B\u0431\u043E\u043E\u0442\u043E\u0439 \u0430\u043D\u0445\u0430\u043D \u0448\u0430\u0442\u043D\u044B \u0431\u04AF\u0445\u0438\u0439 \u043B \u043C\u044D\u0434\u044D\u044D\u043B\u043B\u0438\u0439\u0433 \u043E\u0440\u0443\u0443\u043B\u0430\u0445 \u0448\u0430\u0430\u0440\u0434\u043B\u0430\u0433\u0430\u0442\u0430\u0439. \u04AE\u04AF\u043D\u0438\u0439 \u0442\u0443\u043B\u0434 **"\u0426\u0430\u043B\u0438\u043D - \u0422\u043E\u0445\u0438\u0440\u0433\u043E\u043E"** \u0446\u044D\u0441\u044D\u043D\u0434 \u043E\u0440\u0443\u0443\u043B\u0436 \u04E9\u0433\u043D\u04E9.

### \u041C\u043E\u0434\u0443\u043B\u0438\u0439\u043D \u0431\u04AF\u0442\u044D\u0446

- **\u041B\u0430\u0432\u043B\u0430\u0445** \u2014 \u0430\u0436\u0438\u043B \u043C\u044D\u0440\u0433\u044D\u0436\u0438\u043B, \u0431\u043E\u043B\u043E\u0432\u0441\u0440\u043E\u043B, \u043B\u0438\u0441\u0442\u043D\u0438\u0439 \u0442\u043E\u043C\u044C\u0451\u043E, \u0442\u0430\u0440\u0438\u0444\u0443\u0443\u0434
- **\u0425\u044D\u043B\u0442\u044D\u0441 \u0442\u0430\u0441\u0430\u0433** \u2014 \u0431\u0430\u0439\u0433\u0443\u0443\u043B\u043B\u0430\u0433\u044B\u043D \u043D\u044D\u0433\u0436\u04AF\u04AF\u0434, \u0446\u0430\u043B\u0438\u043D\u0433\u0438\u0439\u043D \u0434\u0430\u043D\u0441\u043D\u044B \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E
- **\u0410\u0436\u0438\u043B\u0442\u043D\u044B \u0430\u043D\u043A\u0435\u0442** \u2014 \u0430\u0436\u0438\u043B\u0442\u0430\u043D \u0431\u04AF\u0440\u0438\u0439\u043D \u04AF\u043D\u0434\u0441\u044D\u043D \u043C\u044D\u0434\u044D\u044D\u043B\u044D\u043B
- **\u0410\u043C\u0440\u0430\u043B\u0442\u044B\u043D \u0442\u04E9\u043B\u04E9\u0432\u043B\u04E9\u0433\u04E9\u04E9** \u2014 \u0430\u043C\u0440\u0430\u043B\u0442\u044B\u043D \u0445\u0443\u0432\u0430\u0430\u0440\u044C
- **\u0426\u0430\u043B\u0438\u043D\u0433\u0438\u0439\u043D \u0442\u043E\u043C\u044C\u0451\u043E\u043D\u044B \u0442\u043E\u0445\u0438\u0440\u0433\u043E\u043E** \u2014 \u043D\u044D\u043C\u044D\u043B\u0442 \u0441\u0443\u0443\u0442\u0433\u0430\u043B, \u0438\u043D\u0442\u0435\u0440\u0432\u0430\u043B\u0430\u0430\u0440 \u0431\u043E\u0434\u043E\u0445 \u0442\u043E\u043C\u044C\u0451\u043E
- **\u0410\u0436\u043B\u044B\u043D \u0445\u043E\u043D\u043E\u0433** \u2014 \u0441\u0430\u0440\u044B\u043D \u0430\u0436\u043B\u044B\u043D \u0445\u043E\u043D\u043E\u0433, \u0446\u0430\u0433
- **\u0423\u0440\u044C\u0434\u0447\u0438\u043B\u0433\u0430\u0430 \u0446\u0430\u043B\u0438\u043D** \u2014 \u0441\u0430\u0440\u044B\u043D \u044D\u0445\u043D\u0438\u0439 \u0446\u0430\u043B\u0438\u043D
- **\u0421\u04AF\u04AF\u043B \u0446\u0430\u043B\u0438\u043D** \u2014 \u0441\u0430\u0440\u044B\u043D \u044D\u0446\u0441\u0438\u0439\u043D \u0446\u0430\u043B\u0438\u043D, \u0430\u043C\u0440\u0430\u043B\u0442, \u043B\u0438\u0441\u0442, \u0425\u0425\u0414\u0425, \u0445\u0438\u0439\u0441\u043D\u044D\u044D\u0440 \u0446\u0430\u043B\u0438\u043D
- **\u0426\u0430\u043B\u0438\u043D\u0433\u0438\u0439\u043D \u0442\u04AF\u04AF\u0432\u044D\u0440** \u2014 \u0430\u0436\u0438\u043B\u0442\u0430\u043D \u0442\u0443\u0441 \u0431\u04AF\u0440\u0438\u0439\u043D \u0434\u044D\u043B\u0433\u044D\u0440\u044D\u043D\u0433\u04AF\u0439, \u043C\u044D\u0439\u043B/\u0431\u0430\u043D\u043A \u0438\u043B\u0433\u044D\u044D\u0445
- **\u042D\u041C\u0414, \u041D\u0414\u0428-\u0438\u0439\u043D \u0442\u043E\u043E\u0446\u043E\u043E** \u2014 \u0441\u0430\u0440 \u0431\u04AF\u0440\u0438\u0439\u043D \u0448\u0438\u043C\u0442\u0433\u044D\u043B\u0438\u0439\u043D \u0442\u0430\u0439\u043B\u0430\u043D
- **\u0413\u04AF\u0439\u043B\u0433\u044D\u044D \u0436\u0443\u0440\u043D\u0430\u043B** \u2014 \u0446\u0430\u043B\u0438\u043D\u0442\u0430\u0439 \u0445\u043E\u043B\u0431\u043E\u043E\u0442\u043E\u0439 \u0434\u0430\u043D\u0441\u043D\u044B \u0431\u0438\u0447\u0438\u043B\u0442
- **\u0426\u0430\u043B\u0438\u043D\u0433\u0438\u0439\u043D \u0442\u043E\u0434\u043E\u0442\u0433\u043E\u0445** \u2014 \u0445\u044D\u043B\u0442\u044D\u0441 \u0442\u0443\u0441 \u0431\u04AF\u0440\u0438\u0439\u043D \u043D\u0430\u0440\u0438\u0439\u0432\u0447\u0438\u043B\u0441\u0430\u043D \u0442\u043E\u043E\u0446\u043E\u043E

### \u0418\u043D\u0442\u0435\u0440\u0432\u0430\u043B\u0430\u0430\u0440 \u0411\u043E\u0434\u043E\u0445 \u0422\u043E\u043C\u044C\u0451\u043E

\u041D\u0414\u0428 \u0431\u043E\u043B\u043E\u043D \u0442\u0430\u0442\u0432\u0430\u0440\u0443\u0443\u0434 \u043D\u044C \u0445\u04E9\u0434\u04E9\u043B\u043C\u04E9\u0440\u0438\u0439\u043D \u0445\u04E9\u043B\u0441\u043D\u0438\u0439 \u0434\u043E\u043E\u0434 \u0445\u044D\u043C\u0436\u044D\u044D\u043D\u044D\u044D\u0441 \u0448\u0430\u043B\u0442\u0433\u0430\u0430\u043B\u0430\u043D \u04E9\u04E9\u0440 \u0442\u043E\u043E\u0446\u043E\u043E\u043B\u043E\u0433\u0434\u0434\u043E\u0433. \u04AE\u04AF\u043D\u0438\u0439\u0433 \u0442\u043E\u043E\u0446\u043E\u043E\u043B\u043E\u0445\u044B\u043D \u0442\u0443\u043B\u0434 \u0446\u043E\u043D\u0445\u043D\u044B \u0434\u043E\u043E\u0440 \u0431\u0430\u0439\u0440\u043B\u0430\u0445 **"\u0418\u043D\u0442\u0435\u0440\u0432\u0430\u043B\u0430\u0430\u0440 \u0431\u043E\u0434\u043E\u0445 \u0442\u043E\u043C\u044C\u0451\u043E"** \u0445\u04AF\u0441\u043D\u044D\u0433\u0442\u044D\u043D\u0434 \u0442\u043E\u043C\u044C\u0451\u043E\u0433 \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0430\u043D \u043E\u0440\u0443\u0443\u043B\u043D\u0430.

**\u0416\u0438\u0448\u044D\u044D \u2014 \u0430\u0436\u0438\u043B\u043B\u0430\u0433\u0441\u0434\u0430\u0430\u0441 \u0442\u04E9\u043B\u04E9\u0445 \u042D\u041C\u0414-\u0438\u0439\u043D \u0442\u043E\u043C\u044C\u0451\u043E:**

- **\u0414\u044D\u044D\u0434** \u2014 \u043E\u0434\u043E\u043E \u043C\u04E9\u0440\u0434\u04E9\u0433\u0434\u04E9\u0436 \u0431\u0430\u0439\u0433\u0430\u0430 \u0446\u0430\u043B\u0438\u043D\u0433\u0438\u0439\u043D \u0434\u043E\u043E\u0434 \u0445\u044D\u043C\u0436\u044D\u044D\u0433 10 \u0434\u0430\u0445\u0438\u043D \u04E9\u0441\u0433\u04E9\u0436, +1 \u043D\u044D\u043C\u043D\u044D (\u0436\u0438\u0448\u044D\u044D \u043D\u044C: 240000 \xD7 10 + 1 = 2400001)
- **\u0414\u043E\u043E\u0434** \u2014 \u0446\u0430\u043B\u0438\u043D\u0433\u0438\u0439\u043D \u0434\u043E\u043E\u0434 \u0445\u044D\u043C\u0436\u044D\u044D\u0433 10 \u0434\u0430\u0445\u0438\u043D \u04E9\u0441\u0433\u04E9\u043D\u04E9 (2400000)
- **\u0411\u043E\u0434\u043E\u0445 \u0430\u0440\u0433\u0430\u0447\u0438\u043B\u0430\u043B** \u2014 \u044D\u0445\u043D\u0438\u0439 \u043C\u04E9\u0440\u04E9\u043D\u0434 "X\\*2%" \u0433\u044D\u0436 \u043E\u0440\u0443\u0443\u043B\u043D\u0430 (\u0445\u0443\u0432\u044C \u0445\u04AF\u043D\u044D\u044D\u0441 \u0441\u0443\u0443\u0442\u0433\u0430\u0445 \u042D\u041C\u0414 2 \u0445\u0443\u0432\u044C \u0443\u0447\u0438\u0440)

\u041E\u0440\u0443\u0443\u043B\u0441\u0430\u043D \u0438\u043D\u0442\u0435\u0440\u0432\u0430\u043B \u0431\u043E\u043B\u043E\u043D \u0431\u043E\u0434\u043E\u0445 \u0430\u0440\u0433\u0430\u0447\u043B\u0430\u043B\u0430\u0430 \u0448\u0430\u043B\u0433\u0430\u0445\u044B\u043D \u0442\u0443\u043B\u0434 **"\u0428\u0430\u043B\u0433\u0430\u0445 \u0443\u0442\u0433\u0430"** \u0445\u044D\u0441\u044D\u0433\u0442 \u0443\u0442\u0433\u0430 \u04E9\u0433\u0447 **"\u0411\u043E\u0434\u043E\u0445"** \u0442\u043E\u0432\u0447 \u0434\u0430\u0440\u0430\u0445\u0430\u0434 **"\u04AF\u0440 \u0434\u04AF\u043D"** \u0445\u044D\u0441\u044D\u0433\u0442 \u0431\u043E\u0434\u043E\u0433\u0434\u0441\u043E\u043D \u0443\u0442\u0433\u0430 \u0433\u0430\u0440\u043D\u0430.

> \u0410\u0436\u0438\u043B \u043E\u043B\u0433\u043E\u0433\u0447\u043E\u043E\u0441 (\u0410\u041E) \u0442\u04E9\u043B\u04E9\u0433\u0434\u04E9\u0445 \u0448\u0438\u043C\u0442\u0433\u044D\u043B\u0438\u0439\u043D \u0445\u0443\u0432\u0438\u0439\u0433 \u043E\u0440\u0443\u0443\u043B\u0430\u0445\u0434\u0430\u0430, \u0436\u0438\u0448\u044D\u044D \u043D\u044C \u042D\u041C\u0414-\u0438\u0439\u043D \u0445\u0443\u0432\u044C\u0434 \u0445\u0430\u0440\u0433\u0430\u043B\u0437\u0430\u0445 "\u0430\u0432\u0430\u0445 \u0443\u0442\u0433\u0430" \u0431\u0430\u0433\u0430\u043D\u0430\u0434 **B15\\*2%** \u0433\u044D\u0436 \u043E\u0440\u0443\u0443\u043B\u043D\u0430 (B15 = \u043E\u043B\u0433\u043E\u0445\u043E\u043E\u0440 \u0442\u043E\u043E\u0446\u0441\u043E\u043D \u0446\u0430\u043B\u0438\u043D).

> \u042D\u043D\u044D \u0446\u043E\u043D\u0445 \u043D\u044C \u0446\u0430\u043B\u0438\u043D\u0433\u0438\u0439\u043D \u0431\u04AF\u0440\u0442\u0433\u044D\u043B\u0438\u0439\u043D \u0445\u0443\u0432\u044C\u0434 \u0443\u044F\u043D \u0445\u0430\u0442\u0430\u043D \u0447\u0430\u043D\u0430\u0440\u044B\u0433 \u0438\u043B\u044D\u0440\u0445\u0438\u0439\u043B\u0441\u044D\u043D \u0441\u0443\u0443\u0440\u044C \u04E9\u0433\u04E9\u0433\u0434\u04E9\u043B \u044E\u043C \u2014 \u0446\u0430\u043B\u0438\u043D\u0433\u0438\u0439\u043D \u043D\u044D\u043C\u044D\u0433\u0434\u044D\u043B, \u0441\u0443\u0443\u0442\u0433\u0430\u043B, \u0448\u0438\u043C\u0442\u0433\u044D\u043B\u0442\u044D\u0439 \u0445\u043E\u043B\u0431\u043E\u043E\u0442\u043E\u0439 \u0445\u0443\u0443\u043B\u0438\u0439\u043D \u04E9\u04E9\u0440\u0447\u043B\u04E9\u043B\u0442\u04E9\u043D\u0434 \u0437\u043E\u0445\u0438\u0446\u043E\u043D \u0431\u043E\u0434\u043E\u0445 \u0430\u0440\u0433\u0430\u0447\u043B\u0430\u043B\u044B\u0433 \u0445\u044F\u043B\u0431\u0430\u0440\u0445\u0430\u043D \u04E9\u04E9\u0440\u0447\u043B\u04E9\u0445 \u0431\u043E\u043B\u043E\u043C\u0436\u0442\u043E\u0439.

\u04AE\u043D\u0434\u0441\u044D\u043D \u0445\u04E9\u0440\u04E9\u043D\u0433\u0438\u0439\u043D \u044D\u043B\u044D\u0433\u0434\u044D\u043B \u0431\u0430\u0439\u0433\u0443\u0443\u043B\u0430\u0445 **4 \u0430\u0440\u0433\u0430\u0430\u0441** \u0441\u043E\u043D\u0433\u043E\u043D \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0430\u0430\u0440 \u044D\u043B\u044D\u0433\u0434\u044D\u043B \u0442\u043E\u043E\u0446\u043D\u043E. \u04AE\u043D\u0434\u0441\u044D\u043D \u0445\u04E9\u0440\u04E9\u043D\u0433\u0438\u0439\u043D \u0434\u044D\u043B\u0433\u044D\u0440\u044D\u043D\u0433\u04AF\u0439 \u0442\u0430\u0439\u043B\u0430\u043D \u0431\u043E\u043B\u043E\u043D \u0445\u043E\u043B\u0431\u043E\u0433\u0434\u043E\u0445 \u0433\u04AF\u0439\u043B\u0433\u044D\u044D \u0436\u0443\u0440\u043D\u0430\u043B\u044B\u0433 \u0445\u0430\u0440\u0430\u0445 \u0431\u043E\u043B\u043E\u043C\u0436\u0442\u043E\u0439.

### \u041C\u043E\u0434\u0443\u043B\u0438\u0439\u043D \u0431\u04AF\u0442\u044D\u0446

- **\u0422\u043E\u0445\u0438\u0440\u0433\u043E\u043E \u043C\u044D\u0434\u044D\u044D\u043B\u044D\u043B** \u2014 \u0430\u043D\u0433\u0438\u043B\u0430\u043B, \u0431\u0430\u0439\u0440\u0448\u0438\u043B, \u044D\u0434 \u0445\u0430\u0440\u0438\u0443\u0446\u0430\u0433\u0447
- **\u04AE\u043D\u0434\u0441\u044D\u043D \u0445\u04E9\u0440\u04E9\u043D\u0433\u0438\u0439\u043D \u0436\u0430\u0433\u0441\u0430\u0430\u043B\u0442** \u2014 \u0431\u04AF\u0440\u0442\u0433\u044D\u0445, \u0430\u0448\u0438\u0433\u043B\u0430\u043B\u0442\u044B\u043D \u043D\u043E\u0440\u043C, \u0437\u0443\u0440\u0430\u0433, \u044D\u043B\u044D\u0433\u0434\u043B\u0438\u0439\u043D \u0430\u0440\u0433\u0443\u0443\u0434, \u0434\u044D\u043B\u0433\u044D\u0440\u044D\u043D\u0433\u04AF\u0439 \u043C\u044D\u0434\u044D\u044D\u043B\u044D\u043B
- **\u0413\u04AF\u0439\u043B\u0433\u044D\u044D \u0445\u0438\u0439\u0445 \u0446\u043E\u043D\u0445** \u2014 \u043E\u0440\u043B\u043E\u0433\u043E, \u0430\u043A\u0442\u043B\u0430\u0445, \u0431\u043E\u0440\u043B\u0443\u0443\u043B\u0430\u0445, \u043A\u0430\u043F\u0438\u0442\u0430\u043B\u0436\u0443\u0443\u043B\u0430\u0445, \u0434\u0430\u0445\u0438\u043D \u04AF\u043D\u044D\u043B\u044D\u0445, \u0448\u0438\u043B\u0436\u04AF\u04AF\u043B\u044D\u0445, \u044D\u043B\u044D\u0433\u0434\u044D\u043B \u0431\u0430\u0439\u0433\u0443\u0443\u043B\u0430\u0445
- **\u0422\u0430\u0439\u043B\u0430\u043D\u0433\u0438\u0439\u043D \u0445\u044D\u0441\u044D\u0433** \u2014 \u04AF\u043B\u0434\u044D\u0433\u0434\u044D\u043B, \u0436\u0443\u0440\u043D\u0430\u043B, \u0435\u0440\u04E9\u043D\u0445\u0438\u0439 \u0434\u044D\u0432\u0442\u044D\u0440

### \u0411\u0430\u043B\u0430\u043D\u0441\u044B\u043D \u0417\u0430\u0434\u0430\u0440\u0433\u0430\u0430 \u04AE\u043B\u0434\u044D\u0433\u0434\u044D\u043B \u041E\u0440\u0443\u0443\u043B\u0430\u0445

\u0411\u0430\u043B\u0430\u043D\u0441 \u0434\u044D\u044D\u0440\u0445 \u04AF\u043D\u0434\u0441\u044D\u043D \u0445\u04E9\u0440\u04E9\u043D\u0433\u0438\u0439\u043D \u0434\u0430\u043D\u0441\u043D\u044B \u04AF\u043B\u0434\u044D\u0433\u0434\u043B\u0438\u0439\u0433 \u0445\u04E9\u0440\u04E9\u043D\u0433\u0438\u0439\u043D \u043D\u044D\u0440, \u0442\u043E\u043E \u0445\u044D\u043C\u0436\u044D\u044D, \u04E9\u0440\u0442\u0433\u04E9\u04E9\u0440 \u0437\u0430\u0434\u0430\u043B\u0436 \u043E\u0440\u0443\u0443\u043B\u043D\u0430.

\u04AE\u043D\u0434\u0441\u044D\u043D \u0445\u04E9\u0440\u04E9\u043D\u0433\u04E9 \u2192 \u0425\u04E9\u0440\u04E9\u043D\u0433\u0438\u0439\u043D \u0436\u0430\u0433\u0441\u0430\u0430\u043B\u0442 \u2192 \u0428\u0438\u043D\u044D \u2192 \u0445\u04E9\u0440\u04E9\u043D\u0433\u0438\u0439\u043D \u043D\u044D\u0440, \u044D\u0434 \u0445\u0430\u0440\u0438\u0443\u0446\u0430\u0433\u0447, \u0431\u0430\u0439\u0440\u0448\u0438\u043B, \u0434\u0430\u043D\u0441\u0443\u0443\u0434\u044B\u0433 \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u043D\u0430.

\u042D\u0445\u043D\u0438\u0439 \u04AF\u043B\u0434\u044D\u0433\u0434\u044D\u043B \u0431\u043E\u043B\u043E\u043D \u043D\u044D\u0433\u0436 \u04E9\u0440\u0442\u0433\u0438\u0439\u0433 **\u0442\u044D\u0433 \u0434\u04AF\u043D\u0433\u044D\u044D\u0440 \u0431\u04AF\u0440\u0442\u0433\u044D\u0436** \u2192 \u04AF\u043D\u0434\u0441\u044D\u043D \u0445\u04E9\u0440\u04E9\u043D\u0433\u0438\u0439\u043D \u043E\u0440\u043B\u043E\u0433\u043E\u043E\u0440 \u0442\u043E\u043E \u0445\u044D\u043C\u0436\u044D\u044D \u0431\u043E\u043B\u043E\u043D \u04E9\u0440\u0442\u0433\u0438\u0439\u0433 \u043D\u044D\u043C\u044D\u0433\u0434\u04AF\u04AF\u043B\u043D\u044D.

\u0411\u0430\u0440\u0430\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B, \u04AF\u043D\u0434\u0441\u044D\u043D \u0445\u04E9\u0440\u04E9\u043D\u0433\u04E9, \u0446\u0430\u043B\u0438\u043D\u0442\u0430\u0439 \u0445\u043E\u043B\u0431\u043E\u043E\u0433\u04AF\u0439 **\u0431\u0443\u0441\u0430\u0434 \u0431\u04AF\u0445 \u0433\u04AF\u0439\u043B\u0433\u044D\u044D\u0433** \u044D\u043D\u044D\u0445\u04AF\u04AF \u0435\u0440\u04E9\u043D\u0445\u0438\u0439 \u0436\u0443\u0440\u043D\u0430\u043B \u0445\u044D\u0441\u044D\u0433\u0442 \u0445\u0438\u0439\u043D\u044D. \u041C\u04E9\u043D \u0433\u04AF\u0439\u043B\u0433\u044D\u044D \u0431\u0430\u043B\u0430\u043D\u0441, \u0435\u0440\u04E9\u043D\u0445\u0438\u0439 \u0436\u0443\u0440\u043D\u0430\u043B, \u0435\u0440\u04E9\u043D\u0445\u0438\u0439 \u0434\u044D\u0432\u0442\u044D\u0440 \u0445\u0430\u0440\u0430\u0445 \u0431\u043E\u043B\u043E\u043C\u0436\u0442\u043E\u0439. \u0422\u04AF\u04AF\u043D\u0447\u043B\u044D\u043D \u0445\u0430\u0430\u043B\u0442 \u0431\u043E\u043B\u043E\u043D \u0442\u043E\u0445\u0438\u0440\u0443\u0443\u043B\u0430\u0445 \u0431\u0438\u0447\u0438\u043B\u0442 \u0445\u0438\u0439\u0445 \u0431\u043E\u043B\u043E\u043C\u0436\u0442\u043E\u0439.
